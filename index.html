// small popover calculator for the 금액 field — for adding up a few line
// items (여러 영수증 항목 더하기 같은) without leaving the sheet to open a
// separate calculator app. The expression is restricted to digits and
// +-*/. before it's ever handed to Function(), so it can't evaluate
// anything but arithmetic.
let closeCalculatorOutsideHandler = null;
function closeCalculator(){
  const pop = document.querySelector('.calc-pop');
  if(pop) pop.remove();
  if(closeCalculatorOutsideHandler){
    document.removeEventListener('mousedown', closeCalculatorOutsideHandler);
    closeCalculatorOutsideHandler = null;
  }
}
function evalCalcExpr(expr){
  if(!expr || !/^[0-9+\-*/. ]+$/.test(expr)) return null;
  if(/[+\-*/.]$/.test(expr.trim())) return null; // trailing operator — incomplete
  try{
    const result = Function('"use strict";return ('+expr+')')();
    return (typeof result==='number' && isFinite(result)) ? result : null;
  }catch(e){ return null; }
}
function openCalculator(triggerBtn, amountInputEl){
  closeCalculator(); closeDatePicker(); closeAssetPicker();
  let expr = amountInputEl.value && /^[0-9]+$/.test(amountInputEl.value) ? amountInputEl.value : '';
  const pop = document.createElement('div');
  pop.className = 'calc-pop';
  pop.innerHTML = `
    <div class="calc-display" id="calcDisplay">0</div>
    <div class="calc-grid">
      <button type="button" class="calc-key calc-fn" data-k="C">C</button>
      <button type="button" class="calc-key calc-fn" data-k="back">⌫</button>
      <button type="button" class="calc-key calc-op" data-k="/">÷</button>
      <button type="button" class="calc-key calc-op" data-k="*">×</button>
      <button type="button" class="calc-key" data-k="7">7</button>
      <button type="button" class="calc-key" data-k="8">8</button>
      <button type="button" class="calc-key" data-k="9">9</button>
      <button type="button" class="calc-key calc-op" data-k="-">−</button>
      <button type="button" class="calc-key" data-k="4">4</button>
      <button type="button" class="calc-key" data-k="5">5</button>
      <button type="button" class="calc-key" data-k="6">6</button>
      <button type="button" class="calc-key calc-op" data-k="+">+</button>
      <button type="button" class="calc-key" data-k="1">1</button>
      <button type="button" class="calc-key" data-k="2">2</button>
      <button type="button" class="calc-key" data-k="3">3</button>
      <button type="button" class="calc-key calc-eq" data-k="=">=</button>
      <button type="button" class="calc-key calc-zero" data-k="0">0</button>
      <button type="button" class="calc-key" data-k=".">.</button>
    </div>
    <button type="button" class="calc-apply-btn">금액에 적용</button>`;
  document.body.appendChild(pop);
  const position = ()=>{
    const r = triggerBtn.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(r.right-pop.offsetWidth, window.innerWidth-pop.offsetWidth-8))+'px';
    let top = r.bottom+6;
    if(top+pop.offsetHeight > window.innerHeight-8) top = r.top-pop.offsetHeight-6;
    pop.style.top = Math.max(8,top)+'px';
  };
  const display = ()=>{ $('#calcDisplay').textContent = expr ? expr.replace(/\*/g,'×').replace(/\//g,'÷') : '0'; };
  $$('.calc-key', pop).forEach(btn=>{
    btn.onclick = ()=>{
      const k = btn.dataset.k;
      if(k==='C'){ expr=''; }
      else if(k==='back'){ expr = expr.slice(0,-1); }
      else if(k==='='){
        const result = evalCalcExpr(expr);
        if(result!==null) expr = String(Math.round(result*100)/100);
      } else {
        expr += k;
      }
      display();
      position();
    };
  });
  pop.querySelector('.calc-apply-btn').onclick = ()=>{
    const result = evalCalcExpr(expr) ?? Number(expr);
    if(!isNaN(result) && expr!==''){ amountInputEl.value = Math.round(Math.abs(result)); }
    closeCalculator();
  };
  display();
  position();
  closeCalculatorOutsideHandler = (e)=>{
    if(!pop.contains(e.target) && e.target!==triggerBtn) closeCalculator();
  };
  setTimeout(()=> document.addEventListener('mousedown', closeCalculatorOutsideHandler), 0);
}

// wires one trigger+hidden-input pair; buildOptions is a function (not a
// static array) since the asset list itself can change while the sheet is
// open (e.g. adding a new asset isn't possible mid-sheet today, but the
// options must still reflect state.assets at click time, not sheet-open
// time). Returns a setter so callers (template quick-fill) can update the
// display without duplicating the "look up the label for this id" logic.
function wireAssetTrigger(triggerId, labelId, hiddenId, buildOptions){
  const trigger = $('#'+triggerId), hidden = $('#'+hiddenId), label = $('#'+labelId);
  if(!trigger || !hidden || !label) return ()=>{};
  const setDisplay = (val)=>{
    hidden.value = val;
    const opts = buildOptions();
    const match = opts.find(o=>o.value===val);
    label.textContent = match ? match.label : (opts[0]?.label || '');
  };
  setDisplay(hidden.value);
  trigger.onclick = ()=>{
    openAssetPicker(trigger, buildOptions(), hidden.value, (v)=>{
      setDisplay(v);
      hidden.dispatchEvent(new Event('change', {bubbles:true}));
    });
  };
  return setDisplay;
}

  $('#closeCat').onclick = closeModal;

  if(existing) guardedClick($('#catDelete'), async ()=>{

    if(inUse && !confirm('이 카테고리를 사용하는 내역이 있어요. 삭제할까요?')) return;
    await deleteDoc('categories', existing.id); closeModal(); scheduleRender(); toast('삭제했어요', {danger:true});
  });
  guardedClick($('#catSave'), async ()=>{
    const name = $('#catName').value.trim();
    if(!name){ toast('이름을 입력해주세요', {danger:true}); shakeSheet(); return; }
    const data = { name, type, icon: iconKey, color };
    if(existing){
      await updateDoc('categories', existing.id, data);
      closeModal(); scheduleRender(); toast('수정했어요');
    } else {
      const newId = await addDoc('categories', data);
      // optimistic local insert so a caller that immediately reopens
      // another modal (see openTxModal's "카테고리 추가" chip) can already
      // see the brand-new category instead of racing the Firestore
      // snapshot round-trip; the real snapshot overwrites this harmlessly
      // once it lands.
      const newCat = { id:newId, ...data };
      if(!state.categories.some(c=>c.id===newId)){ state.categories.push(newCat); idMaps.categories.set(newId, newCat); }
      scheduleRender(); toast('추가했어요');
      // when onSaved is set, it reopens another modal right away (see the
      // "카테고리 추가" chip in openTxModal) which already replaces
      // #modalRoot's content — calling closeModal() here too would queue
      // its delayed clear to wipe that reopened modal out ~160ms later.
      if(onSaved) onSaved(newCat); else closeModal();
    }
  });
}

function openAssetModal(existing){
  const root = $('#modalRoot');
  let type = existing?.type || '현금';
  let color = existing?.color || ACCENT_PRESETS[state.assets.length % ACCENT_PRESETS.length];
  root.innerHTML = `
    <div class="overlay" id="ovAsset">
      <div class="sheet">
        <div class="sheet-head">
          <div class="sheet-title">${existing?'자산 수정':'자산 추가'}</div>
          <button class="sheet-close" id="closeAsset" aria-label="닫기">${icon('close',{size:18})}</button>
        </div>
        <div class="form-group"><label class="form-label">이름</label><input class="form-input" id="assetName" placeholder="예: 주거래 통장" value="${existing?escapeHtml(existing.name):''}"></div>
        <div class="form-group"><label class="form-label">종류</label><select class="form-input" id="assetType"></select></div>
        <div class="form-group"><label class="form-label">금액</label><input class="form-input" type="number" id="assetAmount" placeholder="0" value="${existing?(computeAssetBalances().get(existing.id)||''):''}"></div>
        <div class="form-group"><label class="form-label">색상</label><div class="color-grid" id="assetColor"></div></div>
        <div class="sheet-actions">
          ${existing?'<button class="btn btn-danger" id="assetDelete">삭제</button>':''}
          <button class="btn btn-primary" id="assetSave">저장</button>
        </div>
      </div>
    </div>`;
  $('#assetType').innerHTML = [...ASSET_TYPES_ASSET, ...ASSET_TYPES_LIAB].map(t=>`<option value="${t}" ${type===t?'selected':''}>${t}</option>`).join('');
  const paintColor = ()=>{
    $('#assetColor').innerHTML = ACCENT_PRESETS.map(c=>`<span class="color-opt ${color===c?'sel':''}" data-c="${c}" style="background:${c}"></span>`).join('');
    $$('#assetColor .color-opt').forEach(el=> el.onclick=()=>{ color=el.dataset.c; paintColor(); });
  };
  paintColor();
  $('#closeAsset').onclick = closeModal;
  $('#ovAsset').onclick = (e)=>{ if(e.target.id==='ovAsset') closeModal(); };
  if(existing) guardedClick($('#assetDelete'), async ()=>{
    const inUse = state.transactions.some(t=>t.assetId===existing.id || t.fromAssetId===existing.id || t.toAssetId===existing.id);
    if(inUse && !confirm('이 자산과 연결된 내역이 있어요. 삭제할까요?')) return;
    await deleteDoc('assets', existing.id); closeModal(); scheduleRender(); toast('삭제했어요', {danger:true});
  });
  guardedClick($('#assetSave'), async ()=>{
    const name = $('#assetName').value.trim();
    const amount = Number($('#assetAmount').value);
    const t = $('#assetType').value;
    if(!name){ toast('이름을 입력해주세요', {danger:true}); shakeSheet(); return; }
    if(isNaN(amount) || amount<0){ toast('금액을 확인해주세요', {danger:true}); shakeSheet(); return; }
    // an asset's balance is always initialAmount + every transaction's
    // effect (see computeAssetBalances) — there's no separate live total to
    // overwrite. This field still shows/edits the CURRENT balance, matching
    // what's shown everywhere else, so correcting it here just shifts
    // initialAmount by the difference between what was shown and what was
    // typed — safe at any time, and every transaction stays exactly as
    // accurate as before.
    let initialAmount;
    if(existing){
      const deltaLists = computeAssetDeltaLists();
      const list = deltaLists.get(existing.id) || [];
      const oldInitial = resolveInitialAmount(existing, list);
      const before = oldInitial + list.reduce((s,d)=>s+d.delta, 0);
      initialAmount = oldInitial + (amount - before);
    } else {
      initialAmount = amount;
    }
    const data = { name, type:t, color, icon: ASSET_ICONS[t], initialAmount };
    if(existing) await updateDoc('assets', existing.id, data); else await addDoc('assets', data);
    closeModal(); scheduleRender(); toast(existing?'수정했어요':'추가했어요');
  });
}

        ${icon(c.icon||'sparkle',{size:14})}<span>${escapeHtml(c.name)}</span>
      </span>
    `).join('') : `<div class="empty" style="padding:14px 6px"><div>카테고리를 먼저 추가해주세요</div></div>`;
    $$('#tplCatPick .cat-opt').forEach(el=> el.onclick=()=>{ categoryId=el.dataset.id; paintCatPick(); });
  };
  const fillAssetSelect = ()=>{
    const balances = computeAssetBalances();
    const assets = sortAssetsForPicker(state.assets.filter(a=>!ASSET_TYPES_LIAB.includes(a.type)), balances);
    const liabs = sortAssetsForPicker(state.assets.filter(a=>ASSET_TYPES_LIAB.includes(a.type)), balances);
    const buildOptions = ()=> [
      {value:'', label:'연결 안 함', color:null},
      ...assets.map(a=>({value:a.id, label:a.name, color:a.color})),
      ...liabs.map(a=>({value:a.id, label:a.name, color:a.color})),
    ];
    wireAssetTrigger('tplAssetTrigger','tplAssetLabel','tplAsset', buildOptions);
  };
  paintCatPick();
  fillAssetSelect();
  $$('#tplTypeToggle button').forEach(b=> b.onclick = ()=>{ type=b.dataset.t; categoryId=null; $$('#tplTypeToggle button').forEach(x=>x.className=''); b.className = type==='expense'?'sel-expense':'sel-income'; paintCatPick(); });
  $('#closeTpl').onclick = closeModal;
  $('#ovTpl').onclick = (e)=>{ if(e.target.id==='ovTpl') closeModal(); };
  if(existing) guardedClick($('#tplDelete'), async ()=>{
    await deleteDoc('templates', existing.id); closeModal(); scheduleRender(); toast('삭제했어요', {danger:true});
  });
  guardedClick($('#tplSave'), async ()=>{
    const name = $('#tplName').value.trim();
    const amount = Number($('#tplAmount').value);
    if(!name){ toast('이름을 입력해주세요', {danger:true}); shakeSheet(); return; }
    if(!categoryId){ toast('카테고리를 선택해주세요', {danger:true}); shakeSheet(); return; }
    if(!amount || amount<=0){ toast('금액을 입력해주세요', {danger:true}); shakeSheet(); return; }
    const assetId = $('#tplAsset').value || null;
    const data = { name, type, categoryId, amount, assetId };
    if(existing) await updateDoc('templates', existing.id, data); else await addDoc('templates', data);
    closeModal(); scheduleRender(); toast(existing?'수정했어요':'추가했어요');
  });
}

/* ---------- swipe-to-switch-tab (mobile only) ---------- */
// mirrors the bottom nav's own tab order. Only active at mobile layout
// widths (matches the .app column/bottom-nav breakpoint) so it never
// fights with the desktop rail or with genuinely horizontal-scrolling
// widgets, which all live inside modals rather than #main.
(function initSwipeNav(){
  const TAB_ORDER = ['dashboard','transactions','categories','assets','settings'];
  const main = $('#main');
  let startX = 0, startY = 0, tracking = false;
  main.addEventListener('touchstart', (e)=>{
    tracking = window.innerWidth<=720 && !$('#modalRoot .overlay') && e.touches.length===1;
    if(!tracking) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  }, {passive:true});
  main.addEventListener('touchend', (e)=>{
    if(!tracking) return;
    tracking = false;
    if($('#modalRoot .overlay')) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    // require a decisive, mostly-horizontal drag so an ordinary vertical
    // scroll (or a diagonal thumb slip) never gets mistaken for a swipe.
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return;
    const idx = TAB_ORDER.indexOf(state.tab);
    const nextIdx = idx + (dx<0 ? 1 : -1);
    if(idx===-1 || nextIdx<0 || nextIdx>=TAB_ORDER.length) return;
    state.tab = TAB_ORDER[nextIdx];
    scheduleRender();
  }, {passive:true});
})();

/* ---------- boot ---------- */
paintStaticIcons();
wireAuthUI();
$$('.navlink').forEach(b=> b.onclick = ()=>{ state.tab = b.dataset.tab; scheduleRender(); });
$('#fab').onclick = ()=> openTxModal(null);
applyAccent(state.settings.accent);
</script>
