<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FAFAFB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.svg">
<title>가계부</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.css">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#FAFAFB;
  --surface:#FFFFFF;
  --surface-2:#F1F1F4;
  --border:#E5E7EB;
  --ink:#1B1F2A;
  --ink-soft:#6B7280;
  --ink-faint:#9CA3AF;
  --income:#1FA7AD;
  --expense:#CF5976;
  --accent:#6C4FD9;
  --accent-ink:#ffffff;
  --shadow: 0 1px 2px rgba(16,20,30,0.04), 0 10px 24px -14px rgba(16,20,30,0.14);
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#14161C;
    --surface:#1C1F27;
    --surface-2:#242833;
    --border:#323744;
    --ink:#F4F5F7;
    --ink-soft:#AEB4C0;
    --ink-faint:#767C89;
    --income:#3FC7CC;
    --expense:#E8829A;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 10px 24px -14px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#14161C;
  --surface:#1C1F27;
  --surface-2:#242833;
  --border:#323744;
  --ink:#F4F5F7;
  --ink-soft:#AEB4C0;
  --ink-faint:#767C89;
  --income:#3FC7CC;
  --expense:#E8829A;
  --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 10px 24px -14px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}
@keyframes viewIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
@keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }
@keyframes overlayOut{ from{opacity:1;} to{opacity:0;} }
@keyframes sheetIn{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
@keyframes sheetOut{ from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(14px);} }
@keyframes sheetInCenter{ from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes pulseSoft{ 0%,100%{opacity:1;} 50%{opacity:.45;} }
@keyframes shake{ 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }
html{ touch-action: pan-y; overscroll-behavior-y: contain; }
body{
  margin:0;
  background:
    radial-gradient(1100px 560px at 12% -8%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%),
    radial-gradient(800px 480px at 100% 0%, color-mix(in srgb, var(--income) 6%, transparent), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
  min-height:100vh;
  min-height:100dvh;
  transition:background-color .2s ease;
}
button, .navlink, .tx-row, .cat-chip, .asset-row, .cal-cell, .tpl-chip, .accent-swatch, .color-opt, .icon-opt, .cat-opt{
  -webkit-tap-highlight-color: transparent;
  user-select:none;
  -webkit-user-select:none;
}
#main{animation:viewIn .28s cubic-bezier(.22,.75,.32,1);}
.brand-mark, .hero-badge, .btn-primary, .fab, .accent-swatch, .navlink.active{
  transition:background-color .2s ease, color .2s ease, outline-color .2s ease;
}
.btn, .fab, .navlink, .cat-chip, .asset-row, .tx-row, .cal-cell, .accent-swatch, .color-opt, .icon-opt, .add-cat-chip, .month-nav button, .sheet-close, .tx-view-toggle button, .cat-opt, .preset-chip, .tpl-chip{
  transition:background-color .15s ease, border-color .15s ease, color .15s ease, transform .12s ease, outline-color .15s ease, box-shadow .15s ease;
}
.btn:active, .fab:active, .cat-chip:active, .asset-row:active, .tx-row:active, .cal-cell:active, .navlink:active, .accent-swatch:active, .color-opt:active, .icon-opt:active, .cat-opt:active, .preset-chip:active, .tpl-chip:active{
  transform:scale(0.96);
}
h1,h2,h3,.num-hero{
  font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;
  font-weight:800;
  text-wrap:balance;
  letter-spacing:-0.3px;
}
button{font-family:inherit;}
svg{display:block;}
::selection{background:color-mix(in srgb, var(--accent) 30%, transparent);}
:focus-visible{outline:2px solid color-mix(in srgb, var(--accent) 65%, transparent);outline-offset:2px;border-radius:4px;}

.app{
  max-width:clamp(1080px, 82vw, 1480px);
  margin:0 auto;
  padding: 20px 20px 100px;
  display:flex;
  gap:24px;
}
.rail{
  width:190px;
  flex-shrink:0;
  position:sticky;
  top:20px;
  align-self:flex-start;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px 20px;
}
.brand-mark{
  width:36px;height:36px;border-radius:11px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  color:#fff;
  flex-shrink:0;
}
.brand-name{font-family:'Pretendard Variable','Pretendard',sans-serif;font-size:18px;font-weight:800;}
.brand-sync{font-size:11px;color:var(--ink-faint);display:flex;align-items:center;gap:5px;margin-top:2px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--income);flex-shrink:0;}
.dot.offline{background:var(--ink-faint);}

.navlink{
  display:flex;align-items:center;gap:11px;
  padding:10px 14px;
  border-radius:var(--radius-sm);
  color:var(--ink-soft);
  cursor:pointer;
  font-size:14.5px;
  font-weight:500;
  border:none;background:transparent;
  text-align:left;
  transition:background .15s ease, color .15s ease;
  position:relative;
}
.navlink .ic{width:19px;height:19px;flex-shrink:0;display:flex;}
.navlink:hover{background:var(--surface-2);}
.navlink.active{
  background:color-mix(in srgb, var(--accent) 12%, var(--surface));
  color:var(--accent);
  font-weight:700;
}
.navlink.active::before{
  content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;
  background:var(--accent);
}

main{flex:1;min-width:0;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;
  gap:12px;
}
.page-title{font-size:22px;margin:0;}
.month-nav{
  display:flex;align-items:center;gap:4px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:100px;
  padding:4px 4px;
}
.month-nav button{
  width:26px;height:26px;border-radius:50%;border:none;background:transparent;
  color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
  position:relative;
}
/* visual size stays compact; the tappable area is quietly widened to ~44px
   (Apple/Google's minimum touch target) so small icon buttons are easy to
   hit accurately on a phone. */
.month-nav button::before, .sheet-close::before{
  content:'';position:absolute;inset:-9px;
}
.month-nav button svg{width:15px;height:15px;}
.month-nav button:hover{background:var(--surface-2);color:var(--ink);}
.month-label{font-size:13.5px;font-weight:700;min-width:84px;text-align:center;font-variant-numeric:tabular-nums;}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  padding:20px;
}
.section-gap{display:flex;flex-direction:column;gap:14px;}

.hero{
  display:flex;align-items:center;gap:18px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 7%, var(--surface)), var(--surface) 65%);
  position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;top:-40%;right:-15%;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  pointer-events:none;
}
.hero-badge{
  width:48px;height:48px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(150deg, color-mix(in srgb, var(--accent) 22%, var(--surface)), color-mix(in srgb, var(--accent) 10%, var(--surface)));
  color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px -6px color-mix(in srgb, var(--accent) 45%, transparent);
  position:relative;z-index:1;
}
.hero-badge svg{width:24px;height:24px;}
.hero-label{font-size:13px;color:var(--ink-soft);font-weight:500;position:relative;z-index:1;}
.num-hero{font-size:33px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-0.6px;position:relative;z-index:1;}
.hero-sub{font-size:12.5px;color:var(--ink-faint);margin-top:2px;position:relative;z-index:1;}

.insight-row{display:flex;gap:8px;flex-wrap:wrap;}
.insight-chip{
  background:var(--surface);border:1px solid var(--border);border-radius:100px;
  padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;
}
.insight-chip .ic{width:14px;height:14px;display:flex;flex-shrink:0;}

.tiles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;min-width:0;}
.tile-label{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;font-weight:500;}
.tile-label .ic{
  width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:color-mix(in srgb, currentColor 14%, var(--surface));
}
.tile-label .ic svg{width:14px;height:14px;}
.tile-num{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}
.tile-num.income{color:var(--income);}
.tile-num.expense{color:var(--expense);}
.tile-bar{height:5px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:1px;}
.tile-bar > i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.22,.75,.32,1);}

.two-col{display:grid;grid-template-columns:1.1fr 0.9fr;gap:14px;}
.two-col > .card{min-width:0;}
.card h3{margin:0 0 14px;font-size:14.5px;color:var(--ink);font-weight:700;}
.card h3 .sub{font-family:'Pretendard Variable','Pretendard',sans-serif;font-weight:400;font-size:12px;color:var(--ink-faint);}

.donut-layout{display:flex;flex-direction:column;}
.donut-layout.active{flex-direction:row;align-items:center;gap:14px;}
.donut-chart-box{position:relative;height:186px;flex-shrink:0;width:100%;transition:width .25s ease, height .25s ease;}
.donut-layout.active .donut-chart-box{width:38%;height:150px;}
.legend-list{display:flex;flex-direction:column;gap:2px;margin-top:12px;min-width:0;transition:margin .25s ease;}
.donut-layout.active .legend-list{flex:1;margin-top:0;max-height:150px;overflow-x:hidden;overflow-y:auto;}
.donut-layout.active .legend-amt{display:none;}
.donut-layout.active .legend-row{padding:4px 6px;font-size:12px;}
.donut-tx-list-inner{margin-top:14px;padding-top:10px;border-top:1px solid var(--border);max-height:260px;overflow-y:auto;}
.legend-row{
  display:flex;align-items:center;gap:9px;font-size:13px;
  cursor:pointer;padding:5px 6px;margin:0 -6px;border-radius:8px;
  border:1px solid transparent;
  transition:background-color .15s ease, border-color .15s ease, opacity .15s ease;
}
.legend-row:hover{background:var(--surface-2);}
.legend-row.active{background:var(--surface-2);border-color:var(--border);}
.legend-row.dim{opacity:.4;}
.swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;transition:transform .15s ease;}
.legend-row.active .swatch{transform:scale(1.25);}
.legend-name{flex:1;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.legend-row.active .legend-name{color:var(--ink);font-weight:700;}
.legend-amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;}
.legend-pct{font-size:11.5px;color:var(--ink-faint);width:32px;text-align:right;font-variant-numeric:tabular-nums;}

.cat-change-row{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--border);}
.cat-change-row:last-child{border-bottom:none;}
.cat-change-row .cdot{width:30px;height:30px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.cat-change-row .cdot svg{width:14px;height:14px;}
.cat-change-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.cat-change-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:700;font-size:13px;}
.cat-change-sub{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-change-badge{
  font-weight:800;font-variant-numeric:tabular-nums;font-size:11.5px;white-space:nowrap;flex-shrink:0;
  padding:5px 9px;border-radius:100px;
}
.cat-change-badge.up{color:var(--expense);background:color-mix(in srgb, var(--expense) 13%, transparent);}
.cat-change-badge.down{color:var(--income);background:color-mix(in srgb, var(--income) 13%, transparent);}
.cat-change-badge.flat{color:var(--ink-faint);background:var(--surface-2);}

.analytics-stat-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 10px;margin-bottom:14px;}
.analytics-stat-value{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-0.4px;}
.analytics-stat-label{font-size:12px;color:var(--ink-soft);font-weight:600;}
.analytics-stat-badge{
  margin-left:auto;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;
  padding:4px 9px;border-radius:100px;white-space:nowrap;
}
.analytics-stat-badge.up{color:var(--expense);background:color-mix(in srgb, var(--expense) 13%, transparent);}
.analytics-stat-badge.down{color:var(--income);background:color-mix(in srgb, var(--income) 13%, transparent);}

.goal-progress-wrap{margin-top:12px;}
.goal-progress-bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
.goal-progress-bar > i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .4s cubic-bezier(.22,.75,.32,1);}
.goal-progress-label{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}

.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:36px 10px;color:var(--ink-faint);text-align:center;font-size:13px;
}
.empty .e-ic{width:30px;height:30px;color:var(--ink-faint);}

.asset-mini-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px;}
.asset-mini-name{flex:1;min-width:0;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.asset-mini-bar{flex:1.4;height:7px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
.asset-mini-bar>i{display:block;height:100%;border-radius:5px;}
.asset-mini-amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;min-width:78px;text-align:right;}

.fab{
  position:fixed;right:26px;bottom:26px;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(150deg, color-mix(in srgb, var(--accent) 100%, white 10%), color-mix(in srgb, var(--accent) 100%, black 12%));
  color:var(--accent-ink);
  border:none;cursor:pointer;
  box-shadow:0 12px 24px -10px color-mix(in srgb, var(--accent) 60%, transparent);
  display:flex;align-items:center;justify-content:center;
  z-index:40;
  transition:transform .15s ease, box-shadow .15s ease;
}
.fab:hover{transform:translateY(-2px);box-shadow:0 16px 28px -10px color-mix(in srgb, var(--accent) 70%, transparent);}
.fab svg{width:24px;height:24px;}
#txAddBtn{display:none;}

.tpl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.tpl-head h3{font-size:12.5px;}
.tpl-edit-toggle{
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);
  border-radius:100px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.tpl-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;touch-action:pan-x;}
.tpl-row::-webkit-scrollbar{height:0;}
.tpl-chip{
  display:flex;align-items:center;gap:6px;flex-shrink:0;
  padding:5px 10px 5px 5px;border-radius:100px;border:1px solid var(--border);
  background:var(--surface-2);cursor:pointer;font-size:12px;font-weight:600;color:var(--ink);
  white-space:nowrap;position:relative;
}
.tpl-ic{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tpl-del{
  width:16px;height:16px;border-radius:50%;background:var(--expense);color:#fff;
  display:flex;align-items:center;justify-content:center;margin-left:2px;flex-shrink:0;
}
.tpl-add{padding:5px 12px;color:var(--ink-faint);border-style:dashed;background:transparent;}
.tpl-add:hover{border-color:var(--accent);color:var(--accent);}

.asset-chip-row{display:flex;flex-direction:column;gap:2px;}
.asset-chip{
  display:flex;align-items:center;gap:7px;
  padding:6px 2px;font-size:12.5px;white-space:nowrap;
}
.asset-chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.asset-chip .name{color:var(--ink-soft);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.asset-chip .amt{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;}

.tx-view-toggle{display:inline-flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:3px;}
.tx-view-toggle button{border:none;background:transparent;padding:7px 14px;border-radius:100px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
.tx-view-toggle button.active{background:color-mix(in srgb, var(--accent) 14%, var(--surface));color:var(--accent);}

.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.cal-weekdays span{text-align:center;font-size:11px;color:var(--ink-faint);font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{
  min-height:58px;min-width:0;border-radius:10px;border:1px solid transparent;
  padding:6px 5px;cursor:pointer;background:var(--surface-2);
  display:flex;flex-direction:column;gap:2px;
}
.cal-cell:hover{border-color:var(--border);}
.cal-cell.empty{background:transparent;cursor:default;}
.cal-cell.today .cal-date{color:var(--accent);font-weight:800;}
.cal-cell.selected{background:color-mix(in srgb, var(--accent) 15%, var(--surface));border-color:var(--accent);}
.cal-date{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
.cal-amt{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;}
.cal-amt.income{color:var(--income);}
.cal-amt.expense{color:var(--expense);}

.tx-day-group{margin-bottom:4px;}
.tx-day-label{font-size:11.5px;color:var(--ink-faint);padding:14px 4px 6px;font-weight:700;letter-spacing:.2px;}
.tx-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 6px;border-radius:var(--radius-sm);
  cursor:pointer;
}
.tx-row:hover{background:var(--surface-2);}
.tx-ic{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.tx-ic svg{width:17px;height:17px;}
.tx-mid{flex:1;min-width:0;}
.tx-cat{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-memo{font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap;}
.tx-amt.income{color:var(--income);}
.tx-amt.expense{color:var(--expense);}

.cat-group-title{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:24px 0 12px;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.3px;}
.cat-group-title .ic{width:14px;height:14px;}
.cat-group-title:first-child{margin-top:0;}
.cat-count{margin-left:auto;background:var(--surface-2);color:var(--ink-faint);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;letter-spacing:0;text-transform:none;}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.cat-chip{
  display:flex;align-items:center;gap:11px;min-width:0;
  padding:12px 14px;border-radius:14px;
  background:var(--surface-2);border:1px solid transparent;cursor:pointer;
  font-size:13.5px;font-weight:600;
  transition:transform .12s cubic-bezier(.22,.75,.32,1), box-shadow .15s ease, border-color .15s ease, background-color .15s ease;
}
.cat-chip:hover{border-color:var(--border);box-shadow:0 8px 20px -12px rgba(16,20,30,0.25);transform:translateY(-1.5px);}
.cat-chip:active{transform:translateY(0) scale(.97);}
.cat-chip .cdot{width:32px;height:32px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.cat-chip .cdot svg{width:16px;height:16px;}
.cat-chip-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.add-cat-chip{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 14px;border-radius:14px;
  border:1.5px dashed var(--border);color:var(--ink-faint);cursor:pointer;font-size:13.5px;background:transparent;font-weight:600;
  transition:border-color .15s ease, color .15s ease, background-color .15s ease;
}
.add-cat-chip:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb, var(--accent) 6%, transparent);}

.asset-row{
  display:flex;align-items:center;gap:12px;padding:12px 6px;border-radius:var(--radius-sm);cursor:pointer;
}
.asset-row:hover{background:var(--surface-2);}
.asset-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.asset-ic svg{width:18px;height:18px;}
.asset-mid{flex:1;min-width:0;}
.asset-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.asset-type{font-size:11.5px;color:var(--ink-faint);}
.asset-amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:14.5px;}
.asset-amt.liab{color:var(--expense);}

.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-label{font-size:13.5px;font-weight:700;}
.settings-desc{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.swatch-row{display:flex;gap:9px;flex-wrap:wrap;}
.accent-swatch{
  width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  outline:2px solid transparent;outline-offset:2px;
}
.accent-swatch.sel{outline-color:var(--ink);}
.color-input-wrap{display:flex;align-items:center;gap:8px;}
input[type=color]{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);padding:0;background:none;cursor:pointer;overflow:hidden;}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
input[type=color]::-webkit-color-swatch{border:none;border-radius:50%;}

.btn{
  border:none;border-radius:var(--radius-sm);padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;
  font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;flex-shrink:0;
}
.btn:hover{filter:brightness(1.04);}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-danger{background:color-mix(in srgb, var(--expense) 14%, var(--surface));color:var(--expense);}
.btn-sm{padding:7px 13px;font-size:12.5px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.overlay{
  position:fixed;inset:0;background:rgba(15,17,23,0.45);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:100;
  animation:overlayIn .18s ease;
}
.overlay.center{align-items:center;}
.overlay.closing{animation:overlayOut .16s ease forwards;}
.sheet{
  width:100%;max-width:440px;background:var(--surface);
  border-radius:20px 20px 0 0;
  padding:22px 22px 26px;
  max-height:88vh;overflow-y:auto;
  box-shadow:0 -20px 50px rgba(0,0,0,0.2);
  animation:sheetIn .22s cubic-bezier(.22,.85,.32,1);
}
.overlay.center .sheet{border-radius:18px; animation:sheetInCenter .2s cubic-bezier(.22,.85,.32,1);}
.overlay.closing .sheet{animation:sheetOut .16s ease forwards;}
/* on desktop there's no thumb-reach reason to anchor sheets to the bottom
   edge — that's a mobile-only affordance. Every modal (not just the ones
   explicitly marked .center) becomes a centered dialog on wider screens. */
@media (min-width:721px){
  .overlay{align-items:center;}
  .overlay .sheet{border-radius:18px; box-shadow:0 20px 60px -10px rgba(0,0,0,0.3); animation:sheetInCenter .2s cubic-bezier(.22,.85,.32,1);}
  .fab.tab-tx{display:none !important;}
  #txAddBtn{display:inline-flex;}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.sheet-title{font-size:16.5px;font-weight:800;font-family:'Pretendard Variable','Pretendard',sans-serif;}
.sheet-close{background:none;border:none;color:var(--ink-faint);cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;position:relative;}
.sheet-close svg{width:18px;height:18px;}

.form-group{margin-bottom:15px;}
.form-label{font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:6px;display:block;}
.form-input, select.form-input{
  width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink);font-size:16px;font-family:inherit;
}
.form-input:focus{outline:2px solid color-mix(in srgb, var(--accent) 50%, transparent);outline-offset:1px;}
#txDate{cursor:pointer;caret-color:transparent;}

.date-picker-pop{
  position:fixed;z-index:250;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);box-shadow:0 12px 32px -10px rgba(0,0,0,0.3);
  padding:12px;width:248px;
  animation:sheetInCenter .15s cubic-bezier(.22,.85,.32,1);
}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.dp-label{font-size:13px;font-weight:800;}
.dp-nav{width:26px;height:26px;border-radius:50%;border:none;background:transparent;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.dp-nav svg{width:14px;height:14px;}
.dp-nav:hover{background:var(--surface-2);color:var(--ink);}
.dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
.dp-weekdays span{text-align:center;font-size:10.5px;color:var(--ink-faint);font-weight:700;}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.dp-cell{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;
  font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums;
}
.dp-cell:hover{background:var(--surface-2);}
.dp-cell.today{color:var(--accent);font-weight:800;}
.dp-cell.selected{background:var(--accent);color:var(--accent-ink);}
.dp-today-btn{
  width:100%;margin-top:8px;padding:7px;border-radius:100px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink-soft);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
}
.dp-today-btn:hover{border-color:var(--accent);color:var(--accent);}

.amount-row{display:flex;gap:6px;align-items:center;}
.amount-row .form-input{flex:1;}
.calc-toggle-btn{
  width:42px;height:42px;flex-shrink:0;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.calc-toggle-btn:hover{border-color:var(--accent);color:var(--accent);}
.calc-toggle-btn svg{width:17px;height:17px;}
.calc-pop{
  position:fixed;z-index:250;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);box-shadow:0 12px 32px -10px rgba(0,0,0,0.3);
  padding:12px;width:216px;
  animation:sheetInCenter .15s cubic-bezier(.22,.85,.32,1);
}
.calc-display{
  font-size:20px;font-weight:800;text-align:right;padding:8px 6px 12px;
  color:var(--ink);font-variant-numeric:tabular-nums;word-break:break-all;
}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.calc-key{
  padding:10px 0;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
}
.calc-key:hover{background:color-mix(in srgb, var(--accent) 12%, var(--surface-2));}
.calc-key.calc-op{color:var(--accent);}
.calc-key.calc-fn{color:var(--ink-soft);}
.calc-key.calc-eq{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
.calc-key.calc-zero{grid-column:span 3;}
.calc-apply-btn{
  width:100%;margin-top:10px;padding:9px;border-radius:100px;border:none;
  background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
}

.asset-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;}
.asset-trigger .at-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.asset-trigger svg{flex-shrink:0;color:var(--ink-faint);transform:rotate(90deg);}
.asset-picker-pop{
  position:fixed;z-index:250;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);box-shadow:0 12px 32px -10px rgba(0,0,0,0.3);
  padding:6px;max-height:264px;overflow-y:auto;
  animation:sheetInCenter .15s cubic-bezier(.22,.85,.32,1);
}
.ap-opt{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink);}
.ap-opt:hover{background:var(--surface-2);}
.ap-opt.sel{background:color-mix(in srgb, var(--accent) 12%, var(--surface));color:var(--accent);font-weight:700;}
.ap-opt .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.ap-opt .ap-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.type-toggle{display:flex;gap:6px;}
.type-toggle button{
  flex:1;padding:7px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink-soft);cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;
}
.type-toggle button.sel-expense{background:color-mix(in srgb, var(--expense) 15%, var(--surface));color:var(--expense);border-color:transparent;}
.type-toggle button.sel-transfer{background:color-mix(in srgb, var(--accent) 15%, var(--surface));color:var(--accent);border-color:transparent;}
.type-toggle button.sel-income{background:color-mix(in srgb, var(--income) 15%, var(--surface));color:var(--income);border-color:transparent;}
.cat-pick-grid{display:flex;flex-wrap:wrap;gap:6px;}
.cat-opt{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 9px;border-radius:100px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink-soft);cursor:pointer;font-size:11px;font-weight:600;
}
.cat-opt svg{width:11px;height:11px;flex-shrink:0;}
.cat-opt.sel{font-weight:700;}
.amount-presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.preset-chip{
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);
  border-radius:100px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;
}
.preset-chip.clear{color:var(--ink-faint);}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
.icon-opt{
  aspect-ratio:1;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
}
.icon-opt svg{width:15px;height:15px;}
.icon-opt.sel{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, var(--surface));color:var(--accent);}
.color-grid{display:flex;gap:8px;flex-wrap:wrap;}
.color-opt{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;outline:2px solid transparent;outline-offset:2px;}
.color-opt.sel{outline-color:var(--ink);}
.sheet-actions{display:flex;gap:10px;margin-top:20px;}
.sheet-actions .btn{flex:1;}

.banner{
  font-size:12px;color:var(--ink-soft);background:var(--surface-2);
  border-radius:var(--radius-sm);padding:9px 13px;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}

.toast{
  position:fixed;left:50%;bottom:96px;
  transform:translateX(-50%);
  background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:100px;
  font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 12px 28px -10px rgba(0,0,0,0.35);
  z-index:200;
  animation:toastIn .22s cubic-bezier(.22,.85,.32,1);
  white-space:nowrap;
}
.toast.out{animation:toastOut .18s ease forwards;}
@keyframes toastOut{ from{opacity:1; transform:translate(-50%,0);} to{opacity:0; transform:translate(-50%,8px);} }
.toast .t-dot{width:6px;height:6px;border-radius:50%;background:var(--income);flex-shrink:0;}
.toast.danger .t-dot{background:var(--expense);}
/* when a modal sheet is open, anchor the toast above it instead of at the
   viewport bottom — otherwise it lands right on top of the sheet's inputs */
.toast.in-modal{bottom:auto;top:18px;}
@media (max-width:720px){ .toast{bottom:78px;} .toast.in-modal{top:14px;bottom:auto;} }

.app{display:none;}
#fab{display:none;}
.auth-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:300;padding:20px;
}
.auth-card{
  width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:36px 28px;text-align:center;
}
.auth-mark{
  width:52px;height:52px;border-radius:16px;margin:0 auto 18px;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
}
.auth-title{font-family:'Pretendard Variable','Pretendard',sans-serif;font-weight:800;font-size:21px;}
.auth-desc{font-size:12.5px;color:var(--ink-faint);margin:8px 0 26px;line-height:1.5;}
.auth-error{color:var(--expense);font-size:12px;margin-top:12px;min-height:14px;}

@media (max-width:860px){
  .two-col{grid-template-columns:1fr;}
  /* the 내역-tab pairing (asset list + a small donut) needs much less width
     to stay legible side by side than the dashboard's bigger donut+legend
     pairing does, so it keeps the 2-column layout past the general
     860px cutoff and only stacks near true phone widths. */
  .two-col.two-col-tx{grid-template-columns:1.1fr 0.9fr;}
}
@media (max-width:560px){
  .two-col.two-col-tx{grid-template-columns:1fr;}
}
@media (max-width:720px){
  .app{flex-direction:column;padding:16px 14px 96px;gap:14px;}
  .rail{
    position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;
    flex-direction:row;justify-content:space-around;
    background:var(--surface);border-top:1px solid var(--border);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:50;box-shadow:0 -6px 20px rgba(0,0,0,0.06);
  }
  .brand{display:none;}
  .navlink{flex-direction:column;gap:3px;padding:6px 8px;font-size:10.5px;flex:1;text-align:center;align-items:center;}
  .navlink .ic{width:20px;height:20px;}
  .navlink.active{background:transparent;color:var(--accent);}
  .navlink.active::before{left:50%;top:-9px;transform:translateX(-50%);width:16px;height:3px;border-radius:3px 3px 0 0;}
  .tiles{grid-template-columns:1fr 1fr;}
  .tiles .tile:last-child{grid-column:1 / -1;}
  .page-title{font-size:19px;}
  .num-hero{font-size:27px;}
  .fab{right:18px;bottom:84px;}
  .cal-cell{min-height:44px;padding:4px 3px;gap:1px;}
  .cal-date{font-size:10.5px;}
  .cal-amt{font-size:9px;}
}
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-mark" id="authMark"></div>
    <div class="auth-title">가계부</div>
    <div class="auth-desc">Google 계정으로 로그인하면<br>모든 기기에서 자동으로 동기화돼요</div>
    <button class="btn btn-primary" id="googleLoginBtn" style="width:100%">Google로 계속하기</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<div class="app">
  <nav class="rail" id="rail">
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div>
        <div class="brand-name">가계부</div>
        <div class="brand-sync" id="syncIndicator"><span class="dot"></span><span>연결 중…</span></div>
      </div>
    </div>
    <button class="navlink active" data-tab="dashboard"><span class="ic" data-icon="home"></span><span>홈</span></button>
    <button class="navlink" data-tab="transactions"><span class="ic" data-icon="list"></span><span>내역</span></button>
    <button class="navlink" data-tab="categories"><span class="ic" data-icon="tag"></span><span>카테고리</span></button>
    <button class="navlink" data-tab="assets"><span class="ic" data-icon="wallet"></span><span>자산</span></button>
    <button class="navlink" data-tab="analytics"><span class="ic" data-icon="chart"></span><span>분석</span></button>
    <button class="navlink" data-tab="settings"><span class="ic" data-icon="settings"></span><span>설정</span></button>
  </nav>
  <main id="main"></main>
</div>

<button class="fab" id="fab" title="거래 추가" aria-label="거래 추가"></button>
<div id="modalRoot"></div>

<script>
/* ---------- icon system ---------- */
// every icon's drawn content is verified centered at (12,12) in its 24x24
// viewBox — measured via getBBox() in the browser, not eyeballed; icons whose
// hand-authored coordinates weren't naturally centered get a wrapping
// <g transform="translate(dx,dy)"> that shifts their true visual center back
// to (12,12) exactly (confirmed by re-measuring after the shift).
const ICONS = {
  home: '<g transform="translate(0,0.5)"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h5v-5h2v5h5v-9"/></g>',
  list: '<g transform="translate(0,-0.5)"><rect x="5" y="4" width="14" height="17" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></g>',
  tag: '<g transform="translate(1,1)"><path d="M12 3h7v7l-9 9-7-7z"/><circle cx="15" cy="8" r="1.1" fill="currentColor" stroke="none"/></g>',
  wallet: '<g transform="translate(0,-1.5)"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="17" cy="14.5" r="1.2" fill="currentColor" stroke="none"/></g>',
  settings: '<line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2.1"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2.1"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2.1"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  chevronLeft: '<g transform="translate(0.5,0)"><path d="M15 5l-7 7 7 7"/></g>',

function hexLuminance(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16)/255, g = parseInt(c.substr(2,2),16)/255, b = parseInt(c.substr(4,2),16)/255;
  const f = v => v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4);
  return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);
}
// picks whichever ink color (dark ink vs white) gives the HIGHER contrast
// ratio against this accent, instead of a fixed luminance cutoff — a fixed
// 0.55 threshold never actually fired for any of the 16 ACCENT_PRESETS (the
// brightest, #E8A93A, only reaches 0.458), so every accent always got white
// ink even where it reads poorly (#E8A93A white-on-accent measured at just
// 2.07:1 contrast, far under WCAG's 3:1 floor for UI components/large text —
// verified via the WCAG relative-luminance contrast formula). Contrast-ratio
// comparison also holds up for any custom color from the 직접 고르기 picker,
// which a fixed threshold tuned to one palette wouldn't.
function inkFor(hex){
  const bgLum = hexLuminance(hex);
  const contrastWith = (fgHex) => {
    const fgLum = hexLuminance(fgHex);
    const lighter = Math.max(bgLum, fgLum), darker = Math.min(bgLum, fgLum);
    return (lighter + 0.05) / (darker + 0.05);
  };
  return contrastWith('#1B1F2A') >= contrastWith('#ffffff') ? '#1B1F2A' : '#ffffff';
}

// ---- lazy-load heavy scripts (Firestore ~344KB, Chart.js ~208KB) instead of
// blocking every page load — the login screen only needs Auth (~139KB), and
// charts only render once someone's actually on the dashboard. This is a real
// payload cut: verified via curl that Firestore+Chart.js together are over
// 550KB, vs. ~171KB for app+auth alone.
function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error('load failed: '+src));
    document.head.appendChild(s);
  });
}
let fbDb = null;
let firestoreLoadPromise = null;
function ensureFirestore(){
  if(fbDb) return Promise.resolve(fbDb);
  if(!firestoreLoadPromise){
    firestoreLoadPromise = loadScript('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js').then(()=>{
      fbDb = firebase.firestore();
      // lets the app show cached data instantly and queue writes while
      // offline — real value on mobile (subway, elevator, spotty signal).
      // Safe to ignore if it can't be enabled.
      fbDb.enablePersistence({ synchronizeTabs: true }).catch(err=>{
        console.warn('Firestore offline persistence unavailable:', err.code);
      });
      return fbDb;
    });
  }
  return firestoreLoadPromise;
}
let chartJsLoadPromise = null;
function ensureChartJs(){
  if(typeof Chart !== 'undefined') return Promise.resolve();
  if(!chartJsLoadPromise){
    chartJsLoadPromise = loadScript('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js');
  }
  return chartJsLoadPromise;
}

// id -> item maps kept alongside the arrays so lookups used inside list
// renders (catById/assetById/templateById) are O(1) instead of an O(n)
// .find() per row — matters once a month's transaction list grows.
const idMaps = { categories: new Map(), assets: new Map(), templates: new Map() };
const loadedCollections = new Set();
let legacyMigrationDone = false;
function wireCollection(colRef, key){
  const unsub = colRef.onSnapshot(snap=>{
    state[key] = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(idMaps[key]){
      const m = idMaps[key]; m.clear();
      state[key].forEach(item=> m.set(item.id, item));
    }
    if(key==='categories' && state[key].length===0 && !seededCategories){
      seededCategories = true;
      const batch = fbDb.batch();
      DEFAULT_CATEGORIES.forEach(c=>{ const {id, ...rest} = c; batch.set(colRef.doc(id), rest); });
      batch.commit();
    }
    state.ready = true;
    loadedCollections.add(key);
    // an asset's balance now lives entirely in initialAmount + its
    // transactions (see computeAssetBalances) — an asset written by the
    // previous version has an old-style `amount` instead. Back-solving that
    // into an initialAmount is only safe against the COMPLETE transaction
    // list (recomputing it later, after more transactions exist, would
    // silently re-absorb every new transaction into initialAmount and make
    // the balance stop moving) — so this waits for both collections' first
    // snapshot, runs once, and persists the result immediately.
    if(!legacyMigrationDone && loadedCollections.has('assets') && loadedCollections.has('transactions')){
      legacyMigrationDone = true;
      migrateLegacyAssetBalances();
    }
    scheduleRender();
  }, err=>console.error(err));
  Store.unsubs.push(unsub);
}
function migrateLegacyAssetBalances(){
  const deltaLists = computeAssetDeltaLists();
  state.assets.forEach(a=>{
    if(a.initialAmount!=null) return;
    const list = deltaLists.get(a.id) || [];
    const sumDeltas = list.reduce((s,d)=>s+d.delta, 0);
    const initialAmount = Number(a.amount||0) - sumDeltas;
    a.initialAmount = initialAmount; // optimistic: this render already uses it
    updateDoc('assets', a.id, { initialAmount }).catch(err=>console.error(err));
  });
}

function wireAuthUI(){
  const btn = $('#googleLoginBtn');
  btn.onclick = async ()=>{
    $('#authError').textContent = '';
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = '로그인하는 중…';
    const provider = new firebase.auth.GoogleAuthProvider();
    try{
      // iOS Safari's ITP privacy setting frequently blocks the storage
      // Firebase needs to complete signInWithRedirect (page navigates away
      // to accounts.google.com and back, and the pending-login state gets
      // dropped) — so a popup, which never leaves the page, is the more
      // reliable choice on mobile Safari specifically.
      await fbAuth.signInWithPopup(provider);
      // onAuthStateChanged fires and swaps the screen; nothing else to do.
    }catch(err){
      console.error(err);
      btn.disabled = false;
      btn.textContent = originalText;
      if(err.code === 'auth/popup-blocked'){
        $('#authError').textContent = '팝업이 차단됐어요. 브라우저 팝업 차단을 해제한 뒤 다시 시도해주세요.';
      } else if(err.code === 'auth/cancelled-popup-request' || err.code === 'auth/popup-closed-by-user'){
        // user closed it themselves — no error needed
      } else if(err.code === 'auth/missing-initial-state' || /sessionStorage/i.test(err.message||'')){
        // sessionStorage is blocked/partitioned — almost always because the
        // page is loaded inside an in-app browser (카카오톡, 인스타그램, 네이버
        // 앱 등) or Safari 프라이빗 브라우징, both of which restrict storage
        // for popup-based sign-in. A regular Safari/Chrome tab fixes this.
        $('#authError').textContent = '로그인 정보를 저장할 수 없어요. 카카오톡·인스타그램 등 앱 내 브라우저이거나 시크릿/프라이빗 모드일 수 있어요. Safari나 Chrome에서 직접 열어 다시 시도해주세요.';
      } else {
        $('#authError').textContent = '로그인에 실패했어요. 다시 시도해주세요.';
      }
    }
  };
}

// categories for a given type, most-used first (ties keep original order)
function categoriesByUsage(type){

  return state.categories.filter(c=>c.type===type)
    .map((c,i)=>({c,i}))
    .sort((a,b)=> (counts[b.c.id]||0) - (counts[a.c.id]||0) || a.i-b.i)
    .map(x=>x.c);
}
// one-line spending insight comparing this month's expenses to last month's
function computeSpendInsight(){
  const {y,m} = state.month;
  const prevM = m===1 ? 12 : m-1, prevY = m===1 ? y-1 : y;
  const curTxs = txForMonth(y,m), prevTxs = txForMonth(prevY,prevM);
  const curExpense = sumBy(curTxs,'expense'), prevExpense = sumBy(prevTxs,'expense');
  if(prevExpense<=0 || curExpense<=0) return null;
  const pct = Math.round(((curExpense-prevExpense)/prevExpense)*100);
  if(Math.abs(pct)<5) return null;
  const dir = pct>0 ? '늘었어요' : '줄었어요';
  // find the category driving the biggest chunk of the change
  const byCat = (txs)=>{ const m={}; txs.filter(t=>t.type==='expense').forEach(t=> m[t.categoryId]=(m[t.categoryId]||0)+Number(t.amount||0)); return m; };
  const cur = byCat(curTxs), prev = byCat(prevTxs);
  let topCat=null, topDelta=0;
  Object.keys(cur).forEach(cid=>{
    const d = (cur[cid]||0) - (prev[cid]||0);
    if(Math.abs(d) > Math.abs(topDelta)){ topDelta = d; topCat = cid; }
  });
  const totalDelta = curExpense - prevExpense;
  const catName = topCat && catById(topCat) ? catById(topCat).name : null;
  const driver = (catName && Math.abs(topDelta) >= Math.abs(totalDelta)*0.4) ? `${escapeHtml(catName)} 지출 영향으로 ` : '';
  return `${driver}이번 달 지출이 지난달보다 ${Math.abs(pct)}% ${dir}`;
}
/* ---------- asset balances (fully derived, no stored running total) ----------
   An asset's balance is never separately stored/mutated. It's always exactly
   initialAmount + the sum of every transaction that has ever touched it, so
   there is nothing to drift, reconcile, or get wrong — the transaction list
   IS the ledger. This also means editing an asset's starting balance later
   (to fix a typo, say) is always safe: it just shifts every balance for that
   asset, past and present, by the same fixed amount. */

// how a transaction moves each linked asset's balance, as {assetId: delta}.
// expense drains an asset account but adds to a liability (card/loan)
// balance; income does the reverse. A transfer moves the same amount out of
// one asset and into another, with no income/expense effect on either.
function assetDeltaMap(tx){
  const map = {};
  if(!tx) return map;
  const amt = Number(tx.amount)||0;
  if(tx.type==='transfer'){
    if(tx.fromAssetId) map[tx.fromAssetId] = (map[tx.fromAssetId]||0) - amt;
    if(tx.toAssetId) map[tx.toAssetId] = (map[tx.toAssetId]||0) + amt;
    return map;
  }
  if(!tx.assetId) return map;
  const asset = assetById(tx.assetId);
  if(!asset) return map;
  const isLiab = ASSET_TYPES_LIAB.includes(asset.type);
  const delta = tx.type==='expense' ? (isLiab ? amt : -amt) : (isLiab ? -amt : amt);
  map[tx.assetId] = delta;
  return map;
}
// one pass over every transaction, grouped by which asset(s) it affects —
// the shared building block for both "current balance" and "balance after
// transaction X" so neither has to re-scan the full transaction list itself.
function computeAssetDeltaLists(){
  const byAsset = new Map();
  state.transactions.forEach(t=>{
    const dm = assetDeltaMap(t);
    Object.entries(dm).forEach(([assetId, delta])=>{
      if(!byAsset.has(assetId)) byAsset.set(assetId, []);
      byAsset.get(assetId).push({t, delta});
    });
  });
  return byAsset;
}
// an asset saved before this fully-derived model shipped has an `amount`
// (the old live-mutated field) but no `initialAmount`. Back-solve it once:
// initialAmount = storedAmount - sum(deltas so far) reproduces the exact
// same current total, and every transaction from here on is exact too.
function resolveInitialAmount(asset, deltaList){
  if(asset.initialAmount!=null) return Number(asset.initialAmount)||0;
  const sumDeltas = (deltaList||[]).reduce((s,d)=>s+d.delta, 0);
  return Number(asset.amount||0) - sumDeltas;
}
function computeAssetBalances(){
  const byAsset = computeAssetDeltaLists();
  const map = new Map();
  state.assets.forEach(a=>{
    const list = byAsset.get(a.id) || [];
    const init = resolveInitialAmount(a, list);
    map.set(a.id, init + list.reduce((s,d)=>s+d.delta, 0));
  });
  return map;
}
// ordering for asset-linking pickers (거래 추가's 자산/보내는 계좌/받는 계좌,
// 템플릿의 자산): 현금 accounts first since that's what a transaction most
// often actually moves, then everything else — within each group, the
// account with the larger balance sorts first, since that's more likely to
// be the one currently in use.
function sortAssetsForPicker(list, balances){
  balances = balances || computeAssetBalances();
  return list.slice().sort((a,b)=>{
    const aCash = a.type==='현금' ? 0 : 1, bCash = b.type==='현금' ? 0 : 1;
    if(aCash!==bCash) return aCash-bCash;
    return (balances.get(b.id)||0) - (balances.get(a.id)||0);
  });
}
function netWorth(balances){
  balances = balances || computeAssetBalances();
  let assetsSum = 0, liabSum = 0;
  state.assets.forEach(a=>{
    const bal = balances.get(a.id) || 0;
    if(ASSET_TYPES_LIAB.includes(a.type)) liabSum += bal; else assetsSum += bal;
  });
  return assetsSum - liabSum;
}

// Firestore snapshots (up to 5 collections/docs) and quick user actions can
// each ask for a re-render within the same tick; coalesce them into one paint
// per frame so the dashboard/charts don't flicker-rebuild multiple times.
let renderScheduled = false;
function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(()=>{ renderScheduled = false; render(); });
}
function render(){
  $$('.navlink').forEach(b=> b.classList.toggle('active', b.dataset.tab===state.tab));
  const main = $('#main');

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg, opts){
  opts = opts || {};
  $$('.toast').forEach(t=>t.remove());
  const el = document.createElement('div');
  const modalOpen = !!document.querySelector('#modalRoot .overlay');
  el.className = 'toast' + (opts.danger ? ' danger' : '') + (modalOpen ? ' in-modal' : '');
  el.innerHTML = `<span class="t-dot"></span><span>${escapeHtml(msg)}</span>`;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    el.classList.add('out');
    setTimeout(()=> el.remove(), 200);
  }, 1700);
}

// wraps an async click handler so a fat-finger double-tap (common on mobile)
// can't fire the write twice, and a failed write (offline, permission, etc.)
// surfaces as a toast instead of silently doing nothing.
function guardedClick(btn, fn){
  if(!btn) return;
  btn.onclick = (e)=> runGuarded(btn, ()=>fn(e));
}
async function runGuarded(el, fn){
  if(!el || el.disabled) return;
  el.disabled = true;
  try{
    await fn();
  }catch(err){
    console.error(err);
    toast('문제가 발생했어요. 다시 시도해주세요', {danger:true});
  }finally{
    el.disabled = false;
  }
}

function wonCompact(n){
  const neg = n<0; const abs = Math.abs(n);
  let s;
  if(abs>=100000000) s = (abs/100000000).toFixed(abs%100000000===0?0:1)+'억';
  else if(abs>=10000) s = (abs/10000).toFixed(abs%10000===0?0:1)+'만';
  else s = abs.toLocaleString('ko-KR');
  return (neg?'-':'')+s;
}

let lastNetWorth = null, lastIncome = null, lastExpense = null, lastSavingsRate = null;
function animateNumber(el, from, to, duration, fmt){
  duration = duration || 500;
  fmt = fmt || won;
  const start = performance.now();
  function step(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = fmt(from + (to-from)*eased);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderDonut(txs, expenseTotal){
  const wrap = $('#donutWrap');
  const byCat = {};
  txs.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.categoryId] = (byCat[t.categoryId]||0) + Number(t.amount||0); });
  const entries = Object.entries(byCat).map(([cid,amt])=>({cat:catById(cid), amt})).filter(e=>e.cat).sort((a,b)=>b.amt-a.amt);
  if(entries.length===0){
    wrap.innerHTML = `<div class="empty"><div class="e-ic">${icon('chart',{size:30})}</div><div>이번 달 지출 내역이 아직 없어요</div></div>`;
    return;
  }
  wrap.innerHTML = `<div class="donut-layout" id="donutLayout"><div class="donut-chart-box"><canvas id="donutCanvas"></canvas></div><div class="legend-list" id="donutLegend"></div></div><div id="donutTxList"></div>`;
  const legend = $('#donutLegend');
  // build the whole legend as one string and set innerHTML once, instead of
  // an insertAdjacentHTML per row — one reflow instead of one per category.
  legend.innerHTML = entries.map((e,i)=>{
    const pct = expenseTotal>0 ? Math.round((e.amt/expenseTotal)*100) : 0;
    return `<div class="legend-row" data-idx="${i}">
        <span class="swatch" style="background:${e.cat.color}"></span>
        <span class="legend-name">${escapeHtml(e.cat.name)}</span>
        <span class="legend-pct">${pct}%</span>
        <span class="legend-amt">${won(e.amt)}</span>
      </div>`;
  }).join('');
  if(typeof Chart === 'undefined'){
    $('#donutWrap').insertAdjacentHTML('beforeend', `<div class="empty" style="padding:14px"><div>차트를 불러오는 중이에요…</div></div>`);
    ensureChartJs().then(()=>{ if(state.tab==='dashboard') scheduleRender(); });
    return;
  }
  const ctx = $('#donutCanvas').getContext('2d');
  if(chartDonut) chartDonut.destroy();

  let activeDonutIndex = null;
  // read once per chart build rather than on every draw — afterDatasetsDraw
  // fires on each animation/hover frame, and these CSS custom properties
  // don't change mid-chart, so re-querying getComputedStyle every frame was
  // pure waste.
  const inkColor = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#1B1F2A';
  const softColor = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft').trim() || '#6B7280';

  // real content (name + % + amount) drawn INSIDE the donut hole, never on
  // the slices themselves — so it never gets cramped or spills past a thin
  // wedge. Shows the total by default, or the tapped category's detail.
  const centerLabelPlugin = {
    id:'centerLabel',
    afterDatasetsDraw(chart){
      const c = chart.ctx;
      const {left,right,top,bottom} = chart.chartArea;
      const cx = (left+right)/2, cy = (top+bottom)/2;
      c.save();
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      if(activeDonutIndex !== null && entries[activeDonutIndex]){
        const e = entries[activeDonutIndex];
        const pct = expenseTotal>0 ? Math.round((e.amt/expenseTotal)*100) : 0;
        c.font = "600 11px 'Pretendard Variable','Pretendard',sans-serif";
        c.fillStyle = softColor;
        c.fillText(e.cat.name, cx, cy-16);
        c.font = "800 19px 'Pretendard Variable','Pretendard',sans-serif";
        c.fillStyle = e.cat.color;
        c.fillText(pct+'%', cx, cy+5);
        c.font = "600 10.5px 'Pretendard Variable','Pretendard',sans-serif";
        c.fillStyle = softColor;
        c.fillText(won(e.amt), cx, cy+24);
      } else {
        c.font = "600 11px 'Pretendard Variable','Pretendard',sans-serif";
        c.fillStyle = softColor;
        c.fillText('이번 달 지출', cx, cy-11);
        c.font = "800 17px 'Pretendard Variable','Pretendard',sans-serif";
        c.fillStyle = inkColor;
        c.fillText(won(expenseTotal), cx, cy+11);
      }
      c.restore();
    }
  };

  chartDonut = new Chart(ctx, {
    type:'doughnut',
    data:{ labels: entries.map(e=>e.cat.name), datasets:[{ data: entries.map(e=>e.amt), backgroundColor: entries.map(e=>e.cat.color), borderColor: getComputedStyle(document.body).getPropertyValue('--surface') || '#fff', borderWidth:3, hoverOffset:8 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'72%',
      onClick:(evt, elements)=> setActiveDonutSlice(elements.length ? elements[0].index : null),
      // the center label already shows name/%/amount for the tapped slice,
      // so the default hover tooltip would just duplicate it — worse, it
      // renders at a stale position when triggered via setActiveElements
      // (no real cursor) and visually collides with the center text.
      plugins:{ legend:{display:false}, tooltip:{ enabled:false } } },
    plugins:[centerLabelPlugin]
  });

  function setActiveDonutSlice(i){
    activeDonutIndex = i;
    $$('.legend-row', legend).forEach(row=>{
      const rowIdx = Number(row.dataset.idx);
      row.classList.toggle('active', rowIdx===i);
      row.classList.toggle('dim', i!==null && rowIdx!==i);
    });
    // shrinks the chart to the left and turns the legend into a compact
    // reference list on the right, instead of the default full-width
    // chart-on-top / detailed-list-below stack — the center label already
    // shows the tapped category's name/%/amount, so the side legend only
    // needs to remind what else is in the breakdown.
    $('#donutLayout').classList.toggle('active', i!==null);
    chartDonut.setActiveElements(i===null ? [] : [{datasetIndex:0, index:i}]);
    chartDonut.update();
    // Chart.js's own ResizeObserver picks up the container resize during
    // the CSS transition, but calling resize() right away avoids a stale
    // frame between the class toggle and the observer's next tick.
    chartDonut.resize();
    paintDonutTxList(i);
  }
  // the actual transactions behind the tapped category, this month — the
  // legend only ever showed the aggregate, not what's actually in it.
  function paintDonutTxList(i){
    const listWrap = $('#donutTxList');
    if(i===null){ listWrap.innerHTML = ''; return; }
    const e = entries[i];
    const catTxs = txs.filter(t=>t.type==='expense' && t.categoryId===e.cat.id)
      .sort((a,b)=> a.date===b.date ? (b.updatedAt||0)-(a.updatedAt||0) : b.date.localeCompare(a.date));
    listWrap.innerHTML = `<div class="donut-tx-list-inner">${catTxs.map(txRowHtml).join('')}</div>`;
    wireTxRows(listWrap);
  }
  $$('.legend-row', legend).forEach(row=>{
    row.onclick = ()=>{
      const i = Number(row.dataset.idx);
      setActiveDonutSlice(row.classList.contains('active') ? null : i);
    };
  });
}

// shown at the top of 내역 so the reader always has the same current asset
// figures in view while looking at their transaction history, without
// having to jump to the 자산 tab — every non-liability asset, not just top 5.
function renderTxAssetSummary(){
  const wrap = $('#txAssetSummaryWrap');
  if(!wrap) return;
  const balances = computeAssetBalances();
  // only 현금 (cash) accounts here — 거래 추가 in 내역 links a transaction to

    wrap.innerHTML = `<div class="settings-desc">등록된 현금 자산이 없어요</div>`;
    return;
  }
  // each row stretches to the full width of the column (asset-chip-row is a
  // flex column, default align-items:stretch), so the amount — pinned to
  // the row's own right edge — lands at the same x position on every row
  // regardless of how long that row's asset name is.
  wrap.innerHTML = `<div class="asset-chip-row">${list.map(a=>`
    <span class="asset-chip">
      <span class="dot" style="background:${a.color||'var(--accent)'}"></span>
      <span class="name">${escapeHtml(a.name)}</span>
      <span class="amt">${won(a.bal)}</span>
    </span>`).join('')}</div>`;
}

// compact read-only companion to the asset list on the other side of the
// same row — a smaller version of the dashboard's donut (no click-to-expand
// interaction, since this is meant as an at-a-glance reference while
// looking at the transaction list, not a second place to drill in).
function renderTxCategoryChart(){
  const wrap = $('#txCatChartWrap');
  if(!wrap) return;
  const {y,m} = state.month;
  const txs = txForMonth(y,m).filter(t=>t.type==='expense');
  const total = sumBy(txs,'expense');
  const byCat = {};
  txs.forEach(t=>{ byCat[t.categoryId] = (byCat[t.categoryId]||0) + Number(t.amount||0); });
  const entries = Object.entries(byCat).map(([cid,amt])=>({cat:catById(cid), amt})).filter(e=>e.cat).sort((a,b)=>b.amt-a.amt);
  if(entries.length===0){
    wrap.innerHTML = `<div class="empty" style="padding:10px 6px"><div class="e-ic">${icon('chart',{size:22})}</div><div>이번 달 지출이 없어요</div></div>`;
    return;
  }
  wrap.innerHTML = `<div style="display:flex;align-items:center;gap:10px;">
    <div style="position:relative;height:96px;width:96px;flex-shrink:0;"><canvas id="txCatCanvas"></canvas></div>
    <div class="asset-chip-row" style="flex:1;min-width:0;" id="txCatLegend"></div>
  </div>`;
  const legendList = entries.slice(0,4);
  const restCount = entries.length - legendList.length;
  $('#txCatLegend').innerHTML = legendList.map(e=>{
    const pct = total>0 ? Math.round((e.amt/total)*100) : 0;
    return `<span class="asset-chip">
      <span class="dot" style="background:${e.cat.color}"></span>
      <span class="name">${escapeHtml(e.cat.name)}</span>
      <span class="amt">${pct}%</span>
    </span>`;
  }).join('') + (restCount>0 ? `<span class="asset-chip"><span class="name" style="color:var(--ink-faint)">외 ${restCount}개</span></span>` : '');
  if(typeof Chart === 'undefined'){
    wrap.insertAdjacentHTML('beforeend', `<div class="empty" style="padding:8px"><div>차트를 불러오는 중이에요…</div></div>`);
    ensureChartJs().then(()=>{ if(state.tab==='transactions') scheduleRender(); });
    return;
  }
  const ctx = $('#txCatCanvas').getContext('2d');
  if(chartTxCat) chartTxCat.destroy();
  const inkColor = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#1B1F2A';
  const surfaceColor = getComputedStyle(document.body).getPropertyValue('--surface') || '#fff';
  const centerPlugin = {
    id:'txCatCenter',
    afterDatasetsDraw(chart){
      const c = chart.ctx;
      const {left,right,top,bottom} = chart.chartArea;
      const cx=(left+right)/2, cy=(top+bottom)/2;
      c.save(); c.textAlign='center'; c.textBaseline='middle';
      c.font = "800 12px 'Pretendard Variable','Pretendard',sans-serif";
      c.fillStyle = inkColor;
      c.fillText(wonCompact(total), cx, cy);
      c.restore();
    }
  };
  chartTxCat = new Chart(ctx, {
    type:'doughnut',
    data:{ labels: entries.map(e=>e.cat.name), datasets:[{ data: entries.map(e=>e.amt), backgroundColor: entries.map(e=>e.cat.color), borderColor: surfaceColor, borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{ legend:{display:false}, tooltip:{enabled:false} } },
    plugins:[centerPlugin]
  });
}

function renderTrend(){
  const labels=[], incomeData=[], expenseData=[];
  const base = new Date(state.month.y, state.month.m-1, 1);
  for(let i=5;i>=0;i--){
    const d = new Date(base.getFullYear(), base.getMonth()-i, 1);
    const y=d.getFullYear(), m=d.getMonth()+1;
    labels.push(`${m}월`);
    const txs = txForMonth(y,m);
    incomeData.push(sumBy(txs,'income'));
    expenseData.push(sumBy(txs,'expense'));
  }
  if(typeof Chart === 'undefined'){
    $('#trendCanvas').closest('div').insertAdjacentHTML('beforeend', `<div class="empty" style="padding:14px"><div>차트를 불러오는 중이에요…</div></div>`);
    ensureChartJs().then(()=>{ if(state.tab==='dashboard') scheduleRender(); });
    return;
  }
  const ctx = $('#trendCanvas').getContext('2d');
  const inkSoft = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft').trim() || '#6B7280';
  const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#E5E7EB';
  const incomeColor = getComputedStyle(document.documentElement).getPropertyValue('--income').trim() || '#1FA7AD';
  const expenseColor = getComputedStyle(document.documentElement).getPropertyValue('--expense').trim() || '#CF5976';
  if(chartTrend) chartTrend.destroy();
  chartTrend = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[
      { label:'수입', data: incomeData, borderColor: incomeColor, backgroundColor: incomeColor+'22', fill:true, tension:0.3, pointRadius:3, pointBackgroundColor: incomeColor, borderWidth:2.5 },
      { label:'지출', data: expenseData, borderColor: expenseColor, backgroundColor: expenseColor+'22', fill:true, tension:0.3, pointRadius:3, pointBackgroundColor: expenseColor, borderWidth:2.5 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false,

      plugins:{ legend:{ position:'top', align:'end', labels:{ color:inkSoft, boxWidth:10, boxHeight:10, usePointStyle:true, pointStyle:'circle' } },
        tooltip:{ callbacks:{ label: c => ` ${c.dataset.label}: ${won(c.parsed.y)}` } } } }
  });
}

/* ---------- transactions ---------- */
function txRowHtml(t){
  if(t.type==='transfer'){
    const fromA = t.fromAssetId ? assetById(t.fromAssetId) : null;
    const toA = t.toAssetId ? assetById(t.toAssetId) : null;
    const fromName = fromA ? escapeHtml(fromA.name) : '삭제된 자산';
    const toName = toA ? escapeHtml(toA.name) : '삭제된 자산';
    const memoPart = t.memo ? ` · ${escapeHtml(t.memo)}` : '';
    return `<div class="tx-row" data-id="${t.id}">
      <span class="tx-ic" style="background:var(--surface-2);color:var(--ink-soft)">${icon('swap',{size:17})}</span>
      <div class="tx-mid">
        <div class="tx-cat">계좌 이체</div>
        <div class="tx-memo">${fromName} → ${toName}${memoPart}</div>
      </div>
      <div class="tx-amt">${won(Math.abs(Number(t.amount)))}</div>
    </div>`;
  }
  const c = catById(t.categoryId);
  const color = c ? c.color : '#9CA3AF';
  const a = t.assetId ? assetById(t.assetId) : null;
  const subParts = [a ? escapeHtml(a.name) : null, t.memo ? escapeHtml(t.memo) : null].filter(Boolean);
  return `<div class="tx-row" data-id="${t.id}">
    <span class="tx-ic" style="background:${color}1F;color:${color}">${icon(c?.icon||'sparkle',{size:17})}</span>
    <div class="tx-mid">
      <div class="tx-cat">${c?escapeHtml(c.name):'삭제된 카테고리'}</div>
      ${subParts.length?`<div class="tx-memo">${subParts.join(' · ')}</div>`:''}
    </div>
    <div class="tx-amt ${t.type}">${t.type==='income'?'+':'-'}${won(Math.abs(Number(t.amount)))}</div>
  </div>`;
}

// used from inside openTxModal's "자주 쓰는 거래" quick-pick row — templates
// no longer have their own standalone card on the 내역 page (moved here so
// that page isn't dominated by a big template widget above the actual
// transaction list); callbacks let the caller decide what "added" / "list
// changed" should do (close the add-transaction sheet vs. just repaint).
function renderTemplateRow(wrapId, editMode, callbacks){
  callbacks = callbacks || {};
  const wrap = $('#'+wrapId);
  if(!wrap) return;
  const chips = state.templates.map(t=>{
    const c = catById(t.categoryId);
    const color = c ? c.color : '#9CA3AF';
    return `<div class="tpl-chip" data-id="${t.id}" style="border-color:${color}44">
      <span class="tpl-ic" style="background:${color}1F;color:${color}">${icon(c?.icon||'sparkle',{size:14})}</span>
      <span class="tpl-name">${escapeHtml(t.name)}</span>
      ${editMode?`<span class="tpl-del" data-del="${t.id}">${icon('close',{size:11})}</span>`:''}
    </div>`;
  }).join('');
  wrap.innerHTML = chips + `<button type="button" class="tpl-chip tpl-add" id="${wrapId}AddBtn">${icon('plus',{size:14})}<span>추가</span></button>`;
  $$('.tpl-chip[data-id]', wrap).forEach(chip=>{
    chip.onclick = (e)=>{
      if(e.target.closest('.tpl-del')) return;
      const id = chip.dataset.id;
      if(editMode){ openTemplateModal(templateById(id)); return; }
      // fills the still-open transaction form rather than saving instantly
      // — templates used to live on their own page as a one-tap shortcut,
      // but now that they're inside the add-transaction sheet itself,
      // tapping one and then still having to notice/hit 저장 separately
      // read as "registering the template just added a transaction on its
      // own". Prefilling and leaving 저장 as the one explicit save action
      // removes that surprise.
      if(callbacks.onSelect) callbacks.onSelect(templateById(id));
    };
  });
  $$('.tpl-del', wrap).forEach(del=>{
    guardedClick(del, async (e)=>{
      e.stopPropagation();
      await deleteDoc('templates', del.dataset.del);
      toast('삭제했어요', {danger:true});
      if(callbacks.onDeleted) callbacks.onDeleted();
    });
  });
  $('#'+wrapId+'AddBtn').onclick = ()=> openTemplateModal(null);
}

function renderTxCalendar(){
  const {y,m} = state.month;
  const txs = txForMonth(y,m);
  const byDay = {};
  txs.forEach(t=>{
    const b = (byDay[t.date] ||= {income:0, expense:0});
    b[t.type] += Number(t.amount||0);
  });
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const today = todayStr();
  let cells = '';
  for(let i=0;i<firstWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${y}-${pad2(m)}-${pad2(day)}`;
    const b = byDay[dateStr];
    const cls = ['cal-cell'];
    if(dateStr===today) cls.push('today');
    if(dateStr===state.selectedDay) cls.push('selected');
    cells += `<div class="${cls.join(' ')}" data-date="${dateStr}">
      <span class="cal-date">${day}</span>
      ${b && b.income ? `<span class="cal-amt income">+${wonCompact(b.income)}</span>` : ''}
      ${b && b.expense ? `<span class="cal-amt expense">-${wonCompact(b.expense)}</span>` : ''}
    </div>`;
  }
  const totalCells = firstWeekday + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=0;i<trailing;i++) cells += `<div class="cal-cell empty"></div>`;

  const body = $('#txBody');
  body.innerHTML = `
    <div class="card" style="margin-bottom:14px;">
      <div class="cal-weekdays">${'일월화수목금토'.split('').map(w=>`<span>${w}</span>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div class="card" id="dayDetailCard"></div>
  `;
  $$('.cal-cell[data-date]').forEach(cell=>{
    cell.onclick = ()=>{ state.selectedDay = state.selectedDay===cell.dataset.date ? null : cell.dataset.date; renderTxCalendar(); };
  });
  const detail = $('#dayDetailCard');
  if(!state.selectedDay){
    detail.innerHTML = `<div class="empty" style="padding:24px 10px"><div class="e-ic">${icon('list',{size:26})}</div><div>날짜를 선택하면 그날의 내역을 볼 수 있어요</div></div>`;
    return;
  }
  const dayTxs = state.transactions.filter(t=>t.date===state.selectedDay).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const d = new Date(state.selectedDay+'T00:00:00');
  const label = `${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;
  if(dayTxs.length===0){
    detail.innerHTML = `<h3>${label}</h3><div class="empty" style="padding:18px 10px"><div class="e-ic">${icon('inbox',{size:24})}</div><div>이 날 기록된 내역이 없어요</div></div>`;
    return;
  }
  detail.innerHTML = `<h3>${label}</h3>` + dayTxs.map(txRowHtml).join('');
  wireTxRows(detail);
}

/* ---------- analytics ---------- */
let chartAnalytics = null;
// Monday-start week boundary for a given date, at local midnight.
function weekStart(d){
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()+diff);
}
function computeWeeklySeries(weeksBack){
  const todayMonday = weekStart(new Date());
  const labels=[], data=[];
  for(let i=weeksBack-1; i>=0; i--){
    const start = new Date(todayMonday.getFullYear(), todayMonday.getMonth(), todayMonday.getDate()-7*i);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate()+6);
    const startStr = `${start.getFullYear()}-${pad2(start.getMonth()+1)}-${pad2(start.getDate())}`;
    const endStr = `${end.getFullYear()}-${pad2(end.getMonth()+1)}-${pad2(end.getDate())}`;
    const sum = state.transactions.filter(t=>t.type==='expense' && t.date>=startStr && t.date<=endStr)
      .reduce((s,t)=>s+Number(t.amount||0),0);
    labels.push(`${start.getMonth()+1}/${start.getDate()}`);
    data.push(sum);
  }
  return {labels, data};
}
function computeMonthlySeries(monthsBack){
  const base = new Date();
  const labels=[], data=[];
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(base.getFullYear(), base.getMonth()-i, 1);
    const y=d.getFullYear(), m=d.getMonth()+1;
    labels.push(`${m}월`);
    data.push(sumBy(txForMonth(y,m), 'expense'));
  }
  return {labels, data};
}
// the categories whose spend moved the most (up or down) vs the previous month
function computeCategoryChanges(){
  const {y,m} = state.month;
  const prevM = m===1?12:m-1, prevY = m===1?y-1:y;
  const sumByCat = (txs)=>{ const o={}; txs.forEach(t=> o[t.categoryId]=(o[t.categoryId]||0)+Number(t.amount||0)); return o; };
  const curMap = sumByCat(txForMonth(y,m).filter(t=>t.type==='expense'));
  const prevMap = sumByCat(txForMonth(prevY,prevM).filter(t=>t.type==='expense'));
  const ids = new Set([...Object.keys(curMap), ...Object.keys(prevMap)]);
  return [...ids].map(cid=>{
    const cat = catById(cid);
    if(!cat) return null;
    const curAmt = curMap[cid]||0, prevAmt = prevMap[cid]||0;
    return { cat, curAmt, prevAmt, delta: curAmt-prevAmt };
  }).filter(Boolean).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).slice(0,5);
}
// all-time expense total per weekday (0=일 .. 6=토) — all-time rather than
// just this month so the pattern isn't noisy from a handful of data points.
function computeWeekdayPattern(){
  const sums = [0,0,0,0,0,0,0];
  state.transactions.forEach(t=>{
    if(t.type!=='expense') return;
    const d = new Date(t.date+'T00:00:00');
    sums[d.getDay()] += Number(t.amount||0);
  });
  return sums;
}
// average of (income − expense) over the last 6 months that actually have
// any recorded activity — used only as a starting suggestion for the goal
// calculator's 월 저축액 field, which the user can freely override.
function computeAvgMonthlySavings(){
  const base = new Date();
  let total=0, count=0;
  for(let i=1;i<=6;i++){
    const d = new Date(base.getFullYear(), base.getMonth()-i, 1);
    const txs = txForMonth(d.getFullYear(), d.getMonth()+1);
    if(txs.length===0) continue;
    total += sumBy(txs,'income') - sumBy(txs,'expense');
    count++;
  }
  return count>0 ? total/count : 0;
}
