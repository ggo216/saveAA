// compact read-only companion to the asset list on the other side of the
// same row — a smaller version of the dashboard's donut (no click-to-expand
// interaction, since this is meant as an at-a-glance reference while
// looking at the transaction list, not a second place to drill in).
function renderTxCategoryChart(){
  const wrap = $('#txCatChartWrap');
  if(!wrap) return;
  const {y,m} = state.month;
  const txs = txForMonth(y,m).filter(t=>t.type==='expense');
  const total = sumBy(txs,'expense');
  const byCat = {};
  txs.forEach(t=>{ byCat[t.categoryId] = (byCat[t.categoryId]||0) + Number(t.amount||0); });
  const entries = Object.entries(byCat).map(([cid,amt])=>({cat:catById(cid), amt})).filter(e=>e.cat).sort((a,b)=>b.amt-a.amt);
  if(entries.length===0){
    wrap.innerHTML = `<div class="empty" style="padding:10px 6px"><div class="e-ic">${icon('chart',{size:22})}</div><div>이번 달 지출이 없어요</div></div>`;
    return;
  }
  wrap.innerHTML = `<div style="display:flex;align-items:center;gap:10px;">
    <div style="position:relative;height:96px;width:96px;flex-shrink:0;"><canvas id="txCatCanvas"></canvas></div>
    <div class="asset-chip-row" style="flex:1;min-width:0;" id="txCatLegend"></div>
  </div>`;
  const legendList = entries.slice(0,4);
  const restCount = entries.length - legendList.length;
  $('#txCatLegend').innerHTML = legendList.map(e=>{
    const pct = total>0 ? Math.round((e.amt/total)*100) : 0;
    return `<span class="asset-chip">
      <span class="dot" style="background:${e.cat.color}"></span>
      <span class="name">${escapeHtml(e.cat.name)}</span>
      <span class="amt">${pct}%</span>
    </span>`;
  }).join('') + (restCount>0 ? `<span class="asset-chip"><span class="name" style="color:var(--ink-faint)">외 ${restCount}개</span></span>` : '');
  if(typeof Chart === 'undefined'){
    wrap.insertAdjacentHTML('beforeend', `<div class="empty" style="padding:14px"><div>차트를 불러오는 중이에요…</div></div>`);
    ensureChartJs().then(()=>{ if(state.tab==='transactions') scheduleRender(); });
    return;
  }
  const ctx = $('#txCatCanvas').getContext('2d');
  if(chartTxCat) chartTxCat.destroy();
  const inkColor = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#1B1F2A';
  const surfaceColor = getComputedStyle(document.body).getPropertyValue('--surface') || '#fff';
  const centerPlugin = {
    id:'txCatCenter',
    afterDatasetsDraw(chart){
      const c = chart.ctx;
      const {left,right,top,bottom} = chart.chartArea;
      const cx=(left+right)/2, cy=(top+bottom)/2;
      c.save(); c.textAlign='center'; c.textBaseline='middle';
      c.font = "800 12px 'Pretendard Variable','Pretendard',sans-serif";
      c.fillStyle = inkColor;
      c.fillText(wonCompact(total), cx, cy);
      c.restore();
    }
  };
  chartTxCat = new Chart(ctx, {
    type:'doughnut',
    data:{ labels: entries.map(e=>e.cat.name), datasets:[{ data: entries.map(e=>e.amt), backgroundColor: entries.map(e=>e.cat.color), borderColor: surfaceColor, borderWidth:2 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', animation:{duration:350}, plugins:{ legend:{display:false}, tooltip:{enabled:false} } },
    plugins:[centerPlugin]
  });
}

function renderTrend(){
  const labels=[], incomeData=[], expenseData=[];
  const base = new Date(state.month.y, state.month.m-1, 1);
  for(let i=5;i>=0;i--){
    const d = new Date(base.getFullYear(), base.getMonth()-i, 1);
    const y=d.getFullYear(), m=d.getMonth()+1;
    labels.push(`${m}월`);
    const txs = txForMonth(y,m);
    incomeData.push(sumBy(txs,'income'));
    expenseData.push(sumBy(txs,'expense'));
  }
  if(typeof Chart === 'undefined'){
    $('#trendCanvas').closest('div').insertAdjacentHTML('beforeend', `<div class="empty" style="padding:14px"><div>차트를 불러오는 중이에요…</div></div>`);
    ensureChartJs().then(()=>{ if(state.tab==='dashboard') scheduleRender(); });
    return;
  }
  const ctx = $('#trendCanvas').getContext('2d');
  const inkSoft = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft').trim() || '#6B7280';
  const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#E5E7EB';
  const incomeColor = getComputedStyle(document.documentElement).getPropertyValue('--income').trim() || '#1FA7AD';
  const expenseColor = getComputedStyle(document.documentElement).getPropertyValue('--expense').trim() || '#CF5976';
  if(chartTrend) chartTrend.destroy();
  chartTrend = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[
      { label:'수입', data: incomeData, borderColor: incomeColor, backgroundColor: incomeColor+'22', fill:true, tension:0.3, pointRadius:3, pointBackgroundColor: incomeColor, borderWidth:2.5 },
      { label:'지출', data: expenseData, borderColor: expenseColor, backgroundColor: expenseColor+'22', fill:true, tension:0.3, pointRadius:3, pointBackgroundColor: expenseColor, borderWidth:2.5 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, animation:{duration:350},
      scales:{ y:{ ticks:{ color:inkSoft, callback:v=>won(v) }, grid:{ color:border } }, x:{ ticks:{ color:inkSoft }, grid:{ display:false } } },
      plugins:{ legend:{ position:'top', align:'end', labels:{ color:inkSoft, boxWidth:10, boxHeight:10, usePointStyle:true, pointStyle:'circle' } },
        tooltip:{ callbacks:{ label: c => ` ${c.dataset.label}: ${won(c.parsed.y)}` } } } }
  });
}

/* ---------- transactions ---------- */
function txRowHtml(t){
  const enterCls = t.id===justAddedTxId ? ' pe-row-enter' : '';
  // 선택 mode (bulk delete) swaps every row's leading icon for a checkbox —
  // only ever turned on from the list view, so a row rendered anywhere else
  // (search results, calendar day-detail) simply won't be in select mode.
  const selecting = state.txSelectMode;
  const selCls = selecting ? (state.selectedTxIds.has(t.id) ? ' sel' : '') : '';
  const checkHtml = selecting ? `<span class="tx-check${state.selectedTxIds.has(t.id)?' sel':''}">${state.selectedTxIds.has(t.id)?icon('check',{size:13}):''}</span>` : '';
  if(t.type==='transfer'){
    const fromA = t.fromAssetId ? assetById(t.fromAssetId) : null;
    const toA = t.toAssetId ? assetById(t.toAssetId) : null;
    const fromName = fromA ? escapeHtml(fromA.name) : '삭제된 자산';
    const toName = toA ? escapeHtml(toA.name) : '삭제된 자산';
    const memoPart = t.memo ? ` · ${escapeHtml(t.memo)}` : '';
    return `<div class="tx-row${enterCls}${selCls}" data-id="${t.id}">
      ${checkHtml}
      <span class="tx-ic" style="background:var(--surface-2);color:var(--ink-soft)">${icon('swap',{size:17})}</span>
      <div class="tx-mid">
        <div class="tx-cat">계좌 이체</div>
        <div class="tx-memo">${fromName} → ${toName}${memoPart}</div>
      </div>
      <div class="tx-amt">${won(Math.abs(Number(t.amount)))}</div>
    </div>`;
  }
  const c = catById(t.categoryId);
  const color = c ? c.color : '#9CA3AF';
  const a = t.assetId ? assetById(t.assetId) : null;
  const subParts = [a ? escapeHtml(a.name) : null, t.memo ? escapeHtml(t.memo) : null].filter(Boolean);
  return `<div class="tx-row${enterCls}${selCls}" data-id="${t.id}">
    ${checkHtml}
    <span class="tx-ic" style="background:${color}1F;color:${color}">${icon(c?.icon||'sparkle',{size:17})}</span>
    <div class="tx-mid">
      <div class="tx-cat">${c?escapeHtml(c.name):'삭제된 카테고리'}</div>
      ${subParts.length?`<div class="tx-memo">${subParts.join(' · ')}</div>`:''}
    </div>
    <div class="tx-amt ${t.type}">${t.type==='income'?'+':'-'}${won(Math.abs(Number(t.amount)))}</div>
  </div>`;
}
function wireTxRows(container){
  $$('.tx-row', container).forEach(row=>{
    row.onclick = ()=>{
      if(state.txSelectMode){
        const id = row.dataset.id;
        if(state.selectedTxIds.has(id)) state.selectedTxIds.delete(id); else state.selectedTxIds.add(id);
        // this same row-click path is reachable from search results too
        // (rows there use the identical .tx-row markup) — always calling
        // renderTxList() unconditionally silently swapped a search-results
        // view back to the plain month list while the search input/clear
        // button stayed visible, a real state/view desync. Re-dispatching
        // through the same router the search box itself uses keeps
        // whichever view is actually on screen consistent.
        updateTxSearchView();
        updateTxSelectBar();
        return;
      }
      openTxModal(state.transactions.find(t=>t.id===row.dataset.id));
    };
  });
}
// bulk-recategorize only makes sense when every selected transaction is
// the same non-transfer type — a category belongs to one type, so a mixed
// selection has no single category list that would even apply to all of
// them (계좌 이체 has no category at all).
function bulkRecatEnabled(){
  if(state.selectedTxIds.size===0) return false;
  const types = new Set([...state.selectedTxIds].map(id=> state.transactions.find(t=>t.id===id)?.type));
  return types.size===1 && !types.has('transfer');
}
// keeps the floating "N건 선택됨 · 삭제" bar in sync with the selection Set
// without a full renderTransactions() — that would also destroy/recreate
// the category donut chart for no reason, same cost concern as the
// list/calendar toggle just above.
function updateTxSelectBar(){
  const bar = $('#txSelectBar');
  if(!bar) return;
  $('#txSelectCount').textContent = `${state.selectedTxIds.size}건 선택됨`;
  const delBtn = $('#txBulkDeleteBtn');
  if(delBtn) delBtn.disabled = state.selectedTxIds.size===0;
  const recatBtn = $('#txBulkRecatBtn');
  if(recatBtn) recatBtn.disabled = !bulkRecatEnabled();
}

function renderTransactions(){
  const main = $('#main');
  main.innerHTML = `
    <div class="topbar">
      <h1 class="page-title">내역</h1>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="txMonthNavWrap">${monthNavHtml()}</span>
        <button class="btn btn-ghost btn-sm" id="txSelectToggleBtn" style="${state.txView==='list'?'':'display:none;'}">${state.txSelectMode?'취소':'선택'}</button>
        <button class="btn btn-primary btn-sm" id="txAddBtn" style="${state.txSelectMode?'display:none;':''}">${icon('plus',{size:14})}거래 추가</button>
      </div>
    </div>
    <div class="search-bar-wrap" style="margin-bottom:10px;">
      <span class="search-ic">${icon('search',{size:15})}</span>
      <input type="text" class="search-input" id="txSearchInput" lang="ko" placeholder="메모, 카테고리, 자산, 금액으로 검색" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${escapeHtml(state.txSearchQuery||'')}">
      <button type="button" class="search-clear-btn" id="txSearchClear" style="display:${state.txSearchQuery?'':'none'};" aria-label="검색어 지우기">${icon('close',{size:13})}</button>
    </div>
    <div class="two-col two-col-tx" id="txTwoColRow" style="margin-bottom:10px;">
      <div class="card" style="padding:10px 14px;">
        <div id="txAssetSummaryWrap"></div>
      </div>
      <div class="card" style="padding:10px 14px;">
        <div id="txCatChartWrap"></div>
      </div>
    </div>
    <div class="tx-view-toggle" id="txViewToggleRow" style="margin-bottom:10px;">
      <button data-v="list" class="${state.txView==='list'?'active':''}">목록</button>
      <button data-v="calendar" class="${state.txView==='calendar'?'active':''}">달력</button>
    </div>
    <div id="txBody"></div>
    ${state.txSelectMode ? `<div class="tx-select-bar" id="txSelectBar">
      <span id="txSelectCount">${state.selectedTxIds.size}건 선택됨</span>
      <button type="button" class="btn btn-ghost btn-sm" id="txBulkRecatBtn" ${bulkRecatEnabled()?'':'disabled title="이체가 섞여있거나 지출/수입이 섞여있으면 한 번에 바꿀 수 없어요"'}>카테고리 변경</button>
      <button type="button" class="btn btn-danger btn-sm" id="txBulkDeleteBtn" ${state.selectedTxIds.size===0?'disabled':''}>삭제</button>
    </div>` : ''}
  `;
  wireMonthNav();
  $('#txAddBtn').onclick = ()=> openTxModal(null);
  renderTxAssetSummary();
  renderTxCategoryChart();
  positionToggleIndicator($('#txViewToggleRow'));
  $('#txSelectToggleBtn').onclick = ()=>{
    state.txSelectMode = !state.txSelectMode;
    state.selectedTxIds.clear();
    scheduleRender();
  };
  if($('#txBulkDeleteBtn')) guardedClick($('#txBulkDeleteBtn'), async ()=>{
    const ids = [...state.selectedTxIds];
    if(!ids.length) return;
    if(!confirm(`선택한 ${ids.length}건을 삭제할까요?`)) return;
    // allSettled rather than all — if one delete fails partway through a
    // batch, the ones that DID succeed must still drop out of the
    // selection Set and off the screen instead of lingering as "selected"
    // ghosts of transactions that no longer exist.
    const results = await Promise.allSettled(ids.map(id=> deleteDoc('transactions', id)));
    results.forEach((r,i)=>{ if(r.status==='fulfilled') state.selectedTxIds.delete(ids[i]); });
    const failCount = results.filter(r=>r.status==='rejected').length;
    if(failCount===0){ state.txSelectMode = false; }
    scheduleRender();
    if(failCount>0){
      results.forEach(r=>{ if(r.status==='rejected') console.error(r.reason); });
      toast(`${ids.length-failCount}건 삭제, ${failCount}건 실패했어요`, {danger:true});
    } else {
      toast('삭제했어요', {danger:true});
    }
  });
  if($('#txBulkRecatBtn')) $('#txBulkRecatBtn').onclick = ()=>{
    if(!bulkRecatEnabled()) return;
    const ids = [...state.selectedTxIds];
    const type = state.transactions.find(t=>t.id===ids[0]).type;
    const opts = categoriesByUsage(type).map(c=>({value:c.id, label:c.name, color:c.color}));
    if(!opts.length){ toast('카테고리를 먼저 추가해주세요', {danger:true}); return; }
    openAssetPicker($('#txBulkRecatBtn'), opts, null, async (categoryId)=>{
      const results = await Promise.allSettled(ids.map(id=> updateDoc('transactions', id, {categoryId})));
      const failCount = results.filter(r=>r.status==='rejected').length;
      if(failCount===0){ state.txSelectMode = false; state.selectedTxIds.clear(); }
      scheduleRender();
      toast(failCount>0 ? `${ids.length-failCount}건 변경, ${failCount}건 실패했어요` : `${ids.length}건 카테고리를 변경했어요`, {danger: failCount>0});
    });
  };
  $$('.tx-view-toggle button').forEach(b=> b.onclick = ()=>{
    state.txView = b.dataset.v;
    if(state.txView==='calendar'){
      // 선택 mode only makes sense against the flat list — the calendar's
      // day-detail panel reuses the same row markup/checkbox, so leaving
      // it on here would show checkboxes with no way to see the running
      // total across a whole month at once.
      state.txSelectMode = false; state.selectedTxIds.clear();
      if(!state.selectedDay){
        const t = todayStr();
        state.selectedDay = t.startsWith(monthKey(state.month.y, state.month.m)) ? t : null;
      }
    }
    // swapping 목록/달력 doesn't change the month, the asset totals, or the
    // category chart above it — a full scheduleRender() was rebuilding the
    // topbar and re-creating the Chart.js donut canvas (destroy + new
    // Chart(), the most expensive part of a render) on every toggle click
    // for no reason. Only #txBody actually needs to change.
    $$('.tx-view-toggle button').forEach(x=> x.classList.toggle('active', x===b));
    positionToggleIndicator($('#txViewToggleRow'));
    if(state.txView==='calendar') renderTxCalendar(); else renderTxList();
    // 선택 toggle button and the floating select bar live in the shell built
    // above, outside what the branch above just repainted — cheap direct
    // DOM update keeps them in sync with the now-off select mode without a
    // full re-render (which would also needlessly rebuild the donut chart).
    $('#txSelectToggleBtn').style.display = state.txView==='list' ? '' : 'none';
    $('#txSelectToggleBtn').textContent = state.txSelectMode ? '취소' : '선택';
    if($('#txSelectBar')) $('#txSelectBar').remove();
    $('#txAddBtn').style.display = '';
    $('#fab').style.display = 'flex';
  });
  // the search input is never rebuilt while the user types (only #txBody
  // and the sections it toggles are) — replacing the input element itself
  // on every keystroke would reset the cursor position/IME composition
  // state, which is exactly the kind of input-field bug this session has
  // been careful to avoid elsewhere (the memo field's autocorrect fix).
  // a broad query against a large history can match hundreds of rows, and
  // rebuilding up to TX_SEARCH_RENDER_CAP of them costs ~15-20ms — fine for
  // one keystroke, but a fast typist fires this every ~80-100ms, so a short
  // trailing debounce (the same idea as month-nav's) skips the in-between
  // renders nobody sees instead of paying for every single one.
  $('#txSearchInput').oninput = (e)=>{
    state.txSearchQuery = e.target.value;
    clearTimeout(txSearchDebounceTimer);
    txSearchDebounceTimer = setTimeout(updateTxSearchView, 120);
  };
  $('#txSearchClear').onclick = ()=>{
    clearTimeout(txSearchDebounceTimer);
    state.txSearchQuery = '';
    $('#txSearchInput').value = '';
    updateTxSearchView();
    $('#txSearchInput').focus();
  };
  updateTxSearchView();
}
// switches #txBody (and the month-scoped chrome around it) between the
// normal month view and a flat, all-time search-results view — called on
// every keystroke in the search box, so it must never touch the search
// input element itself.
function updateTxSearchView(){
  // the search render is debounced (see #txSearchInput's oninput), so this
  // can fire after the user has already navigated off the 내역 tab (or off
  // list/calendar entirely) — #txBody won't exist in that case, since a
  // tab switch replaces #main wholesale. Bail rather than let a downstream
  // render function null-deref on a body element that's gone.
  if(!$('#txBody')) return;
  const query = state.txSearchQuery || '';
  const hasQuery = query.trim().length > 0;
  const twoCol = $('#txTwoColRow');
  const viewToggle = $('#txViewToggleRow');
  const monthNav = $('#txMonthNavWrap');
  const clearBtn = $('#txSearchClear');
  if(twoCol) twoCol.style.display = hasQuery ? 'none' : '';
  if(viewToggle) viewToggle.style.display = hasQuery ? 'none' : '';
  if(monthNav) monthNav.style.display = hasQuery ? 'none' : '';
  if(clearBtn) clearBtn.style.display = hasQuery ? '' : 'none';
  if(hasQuery){
    renderTxSearchResults(query);
  } else if(state.txView==='calendar'){
    renderTxCalendar();
  } else {
    renderTxList();
  }
}
// does this transaction match a search term, across memo / category /
// linked-asset name / transfer accounts / amount (digit substring, so
// typing "500" finds ₩5,000 and ₩15,000 alike)?
function txMatchesQuery(t, needle){
  if(!needle) return true;
  if(t.memo && t.memo.toLowerCase().includes(needle)) return true;
  if(t.type==='transfer'){
    if('계좌 이체'.includes(needle)) return true;
    const fromA = t.fromAssetId ? assetById(t.fromAssetId) : null;
    const toA = t.toAssetId ? assetById(t.toAssetId) : null;
    if(fromA && fromA.name.toLowerCase().includes(needle)) return true;
    if(toA && toA.name.toLowerCase().includes(needle)) return true;
  } else {
    const cat = catById(t.categoryId);
    if(cat && cat.name.toLowerCase().includes(needle)) return true;
    const asset = t.assetId ? assetById(t.assetId) : null;
    if(asset && asset.name.toLowerCase().includes(needle)) return true;
  }
  const digits = needle.replace(/[^0-9]/g,'');
  if(digits && String(Math.round(Number(t.amount))).includes(digits)) return true;
  return false;
}
// a short/common query (e.g. a single digit) can match thousands of rows
// out of a large transaction history; rendering all of them on every
// keystroke is the actual cost (the filter itself is sub-5ms even at 5000
// transactions — it's building/wiring thousands of DOM rows that gets
// slow), so cap how many get rendered and tell the user to narrow the
// search instead of silently freezing the input.
const TX_SEARCH_RENDER_CAP = 200;
function renderTxSearchResults(query){
  const body = $('#txBody');
  const needle = query.trim().toLowerCase();
  const matches = state.transactions.filter(t=>txMatchesQuery(t, needle))
    .sort((a,b)=> a.date===b.date ? (b.updatedAt||0)-(a.updatedAt||0) : b.date.localeCompare(a.date));
  if(matches.length===0){
    body.innerHTML = `<div class="card"><div class="empty"><div class="e-ic">${icon('search',{size:28})}</div><div>"${escapeHtml(query)}"에 대한 검색 결과가 없어요</div></div></div>`;
    return;
  }
  const shown = matches.slice(0, TX_SEARCH_RENDER_CAP);
  const groups = {};
  shown.forEach(t=>{ (groups[t.date] ||= []).push(t); });
  // spans potentially many months/years, unlike the normal month-scoped
  // list, so each day label needs the year too — "9월 10일" alone would be
  // ambiguous across a multi-year search result.
  const moreNotice = matches.length > shown.length
    ? `<div class="empty" style="padding:12px 16px;">검색 결과 ${matches.length.toLocaleString('ko-KR')}건 중 ${shown.length}건 표시 · 검색어를 더 구체적으로 입력해보세요</div>`
    : '';
  body.innerHTML = `<div class="card" id="txListCard">${Object.entries(groups).map(([date, items])=>{
    const d = new Date(date+'T00:00:00');
    const label = `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} (${'일월화수목금토'[d.getDay()]})`;
    return `<div class="tx-day-group">
      <div class="tx-day-label">${label}</div>
      ${items.map(txRowHtml).join('')}
    </div>`;
  }).join('')}${moreNotice}</div>`;
  wireTxRows($('#txListCard'));
}

// used from inside openTxModal's "자주 쓰는 거래" quick-pick row — templates
// no longer have their own standalone card on the 내역 page (moved here so
// that page isn't dominated by a big template widget above the actual
// transaction list); callbacks let the caller decide what "added" / "list
// changed" should do (close the add-transaction sheet vs. just repaint).
function renderTemplateRow(wrapId, editMode, callbacks){
  callbacks = callbacks || {};
  const wrap = $('#'+wrapId);
  if(!wrap) return;
  const chips = state.templates.map(t=>{
    const c = catById(t.categoryId);
    const color = c ? c.color : '#9CA3AF';
    return `<div class="tpl-chip" data-id="${t.id}" style="border-color:${color}44">
      <span class="tpl-ic" style="background:${color}1F;color:${color}">${icon(c?.icon||'sparkle',{size:14})}</span>
      <span class="tpl-name">${escapeHtml(t.name)}</span>
      ${editMode?`<span class="tpl-del" data-del="${t.id}">${icon('close',{size:11})}</span>`:''}
    </div>`;
  }).join('');

function renderTxCalendar(){
  const {y,m} = state.month;
  const txs = txForMonth(y,m);
  const byDay = {};
  txs.forEach(t=>{
    const b = (byDay[t.date] ||= {income:0, expense:0});
    b[t.type] += Number(t.amount||0);
  });
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const today = todayStr();
  let cells = '';
  for(let i=0;i<firstWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${y}-${pad2(m)}-${pad2(day)}`;
    const b = byDay[dateStr];
    const cls = ['cal-cell'];
    if(dateStr===today) cls.push('today');
    if(dateStr===state.selectedDay) cls.push('selected');
    cells += `<div class="${cls.join(' ')}" data-date="${dateStr}">
      <span class="cal-date">${day}</span>

      ${b && b.expense ? `<span class="cal-amt expense">-${wonCompact(b.expense)}</span>` : ''}
    </div>`;
  }
  const totalCells = firstWeekday + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;

      // through this same function — a full innerHTML replace just to
      // toggle which cell has .selected, which also meant the detail panel
      // below always hard-swapped with no transition. Now only the grid's

// escapes for BOTH element content and quoted-attribute contexts (some call
// sites interpolate this into value="..."), since d.textContent/innerHTML
// alone never touches quote characters — an unescaped " in a search query
// or name field could otherwise break out of a value="" attribute.
function escapeHtml(s){
  const d=document.createElement('div'); d.textContent=s;
  return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let chartAnalytics = null;
// Monday-start week boundary for a given date, at local midnight.
function weekStart(d){
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()+diff);
}
function computeWeeklySeries(weeksBack){
  const todayMonday = weekStart(new Date());
  const labels=[], data=[];
  for(let i=weeksBack-1; i>=0; i--){
    const start = new Date(todayMonday.getFullYear(), todayMonday.getMonth(), todayMonday.getDate()-7*i);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate()+6);
    const startStr = `${start.getFullYear()}-${pad2(start.getMonth()+1)}-${pad2(start.getDate())}`;
    const endStr = `${end.getFullYear()}-${pad2(end.getMonth()+1)}-${pad2(end.getDate())}`;
    const sum = state.transactions.filter(t=>t.type==='expense' && t.date>=startStr && t.date<=endStr)
      .reduce((s,t)=>s+Number(t.amount||0),0);
    labels.push(`${start.getMonth()+1}/${start.getDate()}`);
    data.push(sum);
  }
  return {labels, data};
}
function computeMonthlySeries(monthsBack){
  const base = new Date();
  const labels=[], data=[];
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(base.getFullYear(), base.getMonth()-i, 1);
    const y=d.getFullYear(), m=d.getMonth()+1;
    labels.push(`${m}월`);
    data.push(sumBy(txForMonth(y,m), 'expense'));
  }
  return {labels, data};
}
// the categories whose spend moved the most (up or down) vs the previous month
// expense transactions within the Monday-start week that begins on
// weekMonday — shared date-range logic with computeWeeklySeries so the two
// never drift out of sync about what "this week" means.
function txsInWeek(weekMonday){
  const end = new Date(weekMonday.getFullYear(), weekMonday.getMonth(), weekMonday.getDate()+6);
  const startStr = `${weekMonday.getFullYear()}-${pad2(weekMonday.getMonth()+1)}-${pad2(weekMonday.getDate())}`;
  const endStr = `${end.getFullYear()}-${pad2(end.getMonth()+1)}-${pad2(end.getDate())}`;
  return state.transactions.filter(t=>t.type==='expense' && t.date>=startStr && t.date<=endStr);
}
// top movers vs the previous period — the previous WEEK when the analytics
// tab's 주별 toggle is active, otherwise the previous month, so this stays
// in sync with whichever comparison the chart above it is showing.
function computeCategoryChanges(){
  let curTxs, prevTxs;
  if(state.analyticsView==='weekly'){
    const thisMonday = weekStart(new Date());
    const lastMonday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate()-7);
    curTxs = txsInWeek(thisMonday);
    prevTxs = txsInWeek(lastMonday);
  } else {
    const {y,m} = state.month;
    const prevM = m===1?12:m-1, prevY = m===1?y-1:y;
    curTxs = txForMonth(y,m).filter(t=>t.type==='expense');
    prevTxs = txForMonth(prevY,prevM).filter(t=>t.type==='expense');
  }
  const sumByCat = (txs)=>{ const o={}; txs.forEach(t=> o[t.categoryId]=(o[t.categoryId]||0)+Number(t.amount||0)); return o; };
  const curMap = sumByCat(curTxs), prevMap = sumByCat(prevTxs);
  const ids = new Set([...Object.keys(curMap), ...Object.keys(prevMap)]);
  return [...ids].map(cid=>{
    const cat = catById(cid);
    if(!cat) return null;
    const curAmt = curMap[cid]||0, prevAmt = prevMap[cid]||0;
    return { cat, curAmt, prevAmt, delta: curAmt-prevAmt };
  }).filter(Boolean).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).slice(0,5);
}
// all-time expense total per weekday (0=일 .. 6=토) — all-time rather than
// just this month so the pattern isn't noisy from a handful of data points.
function computeWeekdayPattern(){
  const sums = [0,0,0,0,0,0,0];
  state.transactions.forEach(t=>{
    if(t.type!=='expense') return;
    const d = new Date(t.date+'T00:00:00');
    sums[d.getDay()] += Number(t.amount||0);
  });
  return sums;
}
// average of (income − expense) over the last 6 months that actually have
// any recorded activity — used only as a starting suggestion for the goal
// calculator's 월 저축액 field, which the user can freely override.
function computeAvgMonthlySavings(){
  const base = new Date();
  let total=0, count=0;
  for(let i=1;i<=6;i++){
    const d = new Date(base.getFullYear(), base.getMonth()-i, 1);
    const txs = txForMonth(d.getFullYear(), d.getMonth()+1);
    if(txs.length===0) continue;
    total += sumBy(txs,'income') - sumBy(txs,'expense');
    count++;
  }
  return count>0 ? total/count : 0;
}

let lastAnalyticsStatValue = null;
function renderAnalyticsChart(){
  const canvas = $('#analyticsCanvas');
  if(!canvas) return;
  const wrap = canvas.closest('div');
  const isWeekly = state.analyticsView==='weekly';
  const {labels, data} = isWeekly ? computeWeeklySeries(8) : computeMonthlySeries(6);
  // this-period vs previous-period at-a-glance, using the same series data
  // that's already being computed for the chart — no extra transaction scan.
  const statWrap = $('#analyticsStatRow');
  if(statWrap && data.length>=2){
    const cur = data[data.length-1], prev = data[data.length-2];
    const delta = cur-prev;
    const up = delta>0;
    const pctStr = prev>0 ? `${Math.round(Math.abs(delta)/prev*100)}%` : '';
    statWrap.innerHTML = `
      <div class="analytics-stat-value">${won(cur)}</div>
      <div class="analytics-stat-label">${isWeekly?'이번 주':'이번 달'} 지출</div>
      ${delta!==0 ? `<div class="analytics-stat-badge ${up?'up':'down'}">${up?'▲':'▼'}${pctStr?' '+pctStr:''} ${won(Math.abs(delta))}</div>` : ''}

    if(lastAnalyticsStatValue !== null && lastAnalyticsStatValue !== cur){ animateNumber(statEl, lastAnalyticsStatValue, cur); }
    lastAnalyticsStatValue = cur;
  } else if(statWrap){
    statWrap.innerHTML = '';
    lastAnalyticsStatValue = null;
  }
  if(typeof Chart === 'undefined'){
    wrap.insertAdjacentHTML('beforeend', `<div class="empty" style="padding:14px"><div>차트를 불러오는 중이에요…</div></div>`);
    ensureChartJs().then(()=>{ if(state.tab==='analytics') scheduleRender(); });
    return;
  }
  const ctx = canvas.getContext('2d');
  const inkSoft = getComputedStyle(document.documentElement).getPropertyValue('--ink-soft').trim() || '#6B7280';
  const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#E5E7EB';
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6C4FD9';

  // updating the live chart's data lets Chart.js tween bars from their old
  // height to the new one instead of a destroy+recreate hard-cut. Only a
  // genuine tab re-entry (a fresh #analyticsCanvas element) still needs a
  // full rebuild.
  if(chartAnalytics && chartAnalytics.canvas === canvas){

    chartAnalytics.data.datasets[0].backgroundColor = accent+'CC';

    chartAnalytics.options.scales.y.grid.color = border;
    chartAnalytics.options.scales.x.ticks.color = inkSoft;
    chartAnalytics.update();
    return;
  }
  if(chartAnalytics) chartAnalytics.destroy();
  chartAnalytics = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor: accent+'CC', borderRadius:6, maxBarThickness:28 }] },
    options:{ responsive:true, maintainAspectRatio:false, animation:{duration:350},
      scales:{ y:{ ticks:{ color:inkSoft, callback:v=>wonCompact(v) }, grid:{ color:border } }, x:{ ticks:{ color:inkSoft }, grid:{ display:false } } },
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:c=>won(c.parsed.y) } } } }
  });
}

/* ---------- modals ---------- */
// a sheet covers the screen but the page behind it is still the real
// scroll container (no internal scroll wrapper), so without this, a drag
// on the overlay's backdrop rubber-bands the PAGE on mobile — a well-known
// "feels broken" tell in an otherwise-solid modal, and it also leaves the
// page scrolled somewhere unexpected once the sheet closes.
function lockBodyScroll(){ document.body.style.overflow = 'hidden'; }
function unlockBodyScroll(){ document.body.style.overflow = ''; }
function closeModal(){
  closeDatePicker();
  closeCalculator();
  closeAssetPicker();
  const overlay = $('#modalRoot .overlay');
  if(!overlay){ $('#modalRoot').innerHTML=''; unlockBodyScroll(); return; }
  overlay.classList.add('closing');
  setTimeout(()=>{ $('#modalRoot').innerHTML=''; unlockBodyScroll(); }, 160);
}
document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){
    // Enter submits whichever sheet is open — but only when it's a plain
    // text field being typed into, not a button (native Enter already
    // clicks it) and not while a popover sits on top (the calculator has
    // its own Enter behavior — compute then apply — so let it handle Enter
    // itself rather than also submitting the sheet underneath).
    if(document.querySelector('.date-picker-pop, .calc-pop, .asset-picker-pop')) return;
    const overlay = $('#modalRoot .overlay');
    if(!overlay || e.target.tagName!=='INPUT') return;
    // a readonly field (날짜) isn't actually being typed into — Enter here
    // reads as "open this" (same as a click/tap would), not "I'm done with
    // the form", so it shouldn't submit whatever's currently filled in.
    if(e.target.readOnly){ e.preventDefault(); e.target.click(); return; }
    const saveBtn = overlay.querySelector('.sheet-actions .btn-primary');
    if(saveBtn){ e.preventDefault(); saveBtn.click(); }
    return;
  }
  if(e.key!=='Escape') return;
  // a popover (date/calculator/asset picker) sits on top of the sheet, not
  // inside it — Escape should back out of just that first, the same way an
  // outside click does, rather than jumping straight to closing the whole
  // 거래 추가 sheet underneath it.
  if(document.querySelector('.date-picker-pop, .calc-pop, .asset-picker-pop')){
    closeDatePicker(); closeCalculator(); closeAssetPicker();
    return;
  }
  if($('#modalRoot .overlay')) closeModal();
});
function shakeSheet(){
  const sheet = $('#modalRoot .sheet');
  if(!sheet) return;
  sheet.style.animation = 'none';
  void sheet.offsetWidth;
  sheet.style.animation = 'shake .32s ease';
}

    pop.querySelector('.dp-label').textContent = `${viewY}년 ${viewM}월`;

// small popover calculator for the 금액 field — for adding up a few line
// items (여러 영수증 항목 더하기 같은) without leaving the sheet to open a
// separate calculator app. The expression is restricted to digits and
// +-*/. before it's ever handed to Function(), so it can't evaluate
// anything but arithmetic.
let closeCalculatorOutsideHandler = null;
let calcKeydownHandler = null;
function closeCalculator(){
  const pop = document.querySelector('.calc-pop');
  if(pop) pop.remove();
  if(closeCalculatorOutsideHandler){
    document.removeEventListener('mousedown', closeCalculatorOutsideHandler);
    closeCalculatorOutsideHandler = null;
  }
  if(calcKeydownHandler){
    document.removeEventListener('keydown', calcKeydownHandler);
    calcKeydownHandler = null;
  }
}
function evalCalcExpr(expr){
  if(!expr || !/^[0-9+\-*/. ]+$/.test(expr)) return null;
  if(/[+\-*/.]$/.test(expr.trim())) return null; // trailing operator — incomplete
  try{
    const result = Function('"use strict";return ('+expr+')')();
    return (typeof result==='number' && isFinite(result)) ? result : null;
  }catch(e){ return null; }
}
function openCalculator(triggerBtn, amountInputEl){
  closeCalculator(); closeDatePicker(); closeAssetPicker();
  let expr = amountValue(amountInputEl) ? String(amountValue(amountInputEl)) : '';
  const pop = document.createElement('div');
  pop.className = 'calc-pop';
  pop.innerHTML = `
    <div class="calc-display" id="calcDisplay">0</div>
    <div class="calc-grid">
      <button type="button" class="calc-key calc-fn" data-k="C">C</button>
      <button type="button" class="calc-key calc-fn" data-k="back">⌫</button>
      <button type="button" class="calc-key calc-op" data-k="/">÷</button>
      <button type="button" class="calc-key calc-op" data-k="*">×</button>
      <button type="button" class="calc-key" data-k="7">7</button>
      <button type="button" class="calc-key" data-k="8">8</button>
      <button type="button" class="calc-key" data-k="9">9</button>
      <button type="button" class="calc-key calc-op" data-k="-">−</button>
      <button type="button" class="calc-key" data-k="4">4</button>
      <button type="button" class="calc-key" data-k="5">5</button>
      <button type="button" class="calc-key" data-k="6">6</button>
      <button type="button" class="calc-key calc-op" data-k="+">+</button>
      <button type="button" class="calc-key" data-k="1">1</button>
      <button type="button" class="calc-key" data-k="2">2</button>
      <button type="button" class="calc-key" data-k="3">3</button>
      <button type="button" class="calc-key calc-eq" data-k="=">=</button>
      <button type="button" class="calc-key calc-zero" data-k="0">0</button>
      <button type="button" class="calc-key" data-k=".">.</button>
    </div>
    <button type="button" class="calc-apply-btn">금액에 적용</button>`;
  document.body.appendChild(pop);
  const position = ()=>{
    const r = triggerBtn.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(r.right-pop.offsetWidth, window.innerWidth-pop.offsetWidth-8))+'px';
    let top = r.bottom+6;
    if(top+pop.offsetHeight > window.innerHeight-8) top = r.top-pop.offsetHeight-6;
    pop.style.top = Math.max(8,top)+'px';
  };
  const display = ()=>{ $('#calcDisplay').textContent = expr ? expr.replace(/\*/g,'×').replace(/\//g,'÷') : '0'; };
  const applyToAmount = ()=>{
    const result = evalCalcExpr(expr) ?? Number(expr);
    if(!isNaN(result) && expr!==''){ setAmountValue(amountInputEl, Math.round(Math.abs(result))); }
    closeCalculator();
  };
  // pressing = (or Enter) once computes, same as before; pressing it AGAIN
  // right after — with nothing else typed in between — applies the result
  // to the amount field and closes, so "12+8, Enter, Enter" is a full
  // compute-and-commit without ever touching the mouse. Any other key
  // resets this so a fresh calculation doesn't accidentally auto-apply.
  let justComputed = false;
  $$('.calc-key', pop).forEach(btn=>{
    btn.onclick = ()=>{

      if(k==='='){
        if(justComputed){ applyToAmount(); return; }
        const result = evalCalcExpr(expr);
        if(result!==null){ expr = String(Math.round(result*100)/100); justComputed = true; }
      } else {
        justComputed = false;
        if(k==='C'){ expr=''; }
        else if(k==='back'){ expr = expr.slice(0,-1); }
        else{ expr += k; }
      }
      display();
      position();
    };
  });
  pop.querySelector('.calc-apply-btn').onclick = applyToAmount;
  display();
  position();
  closeCalculatorOutsideHandler = (e)=>{
    if(!pop.contains(e.target) && e.target!==triggerBtn) closeCalculator();
  };
  setTimeout(()=> document.addEventListener('mousedown', closeCalculatorOutsideHandler), 0);
  // physical/on-screen keyboard support — clicking each button was already
  // there, this maps the same data-k values so typing "12+8" then Enter
  // works exactly like tapping those keys one by one. Escape is handled by
  // the app-wide Escape listener (it checks for an open popover first).
  calcKeydownHandler = (e)=>{
    let k = null;
    if(/^[0-9]$/.test(e.key)) k = e.key;
    else if(e.key==='.') k = '.';
    else if(e.key==='+') k = '+';
    else if(e.key==='-') k = '-';
    else if(e.key==='*' || e.key.toLowerCase()==='x') k = '*';
    else if(e.key==='/') k = '/';
    else if(e.key==='Enter' || e.key==='=') k = '=';
    else if(e.key==='Backspace' || e.key==='Delete') k = 'back';
    else if(e.key.toLowerCase()==='c') k = 'C';
    if(!k) return;
    e.preventDefault();
    pop.querySelector(`.calc-key[data-k="${k}"]`)?.click();
  };
  document.addEventListener('keydown', calcKeydownHandler);
}

// custom dropdown for asset pickers — a native <select>'s own popup can't
// be styled at all (no color dots, no matching the app's design), so these
// fields are a hidden input holding the real value plus a visible trigger
// that opens a popover built the same way as the date/calculator ones.
let closeAssetPickerOutsideHandler = null;
function closeAssetPicker(){
  const pop = document.querySelector('.asset-picker-pop');
  if(pop) pop.remove();
  if(closeAssetPickerOutsideHandler){
    document.removeEventListener('mousedown', closeAssetPickerOutsideHandler);
    closeAssetPickerOutsideHandler = null;
  }
}
function openAssetPicker(triggerEl, options, currentValue, onPick){
  closeAssetPicker(); closeDatePicker(); closeCalculator();
  const pop = document.createElement('div');
  pop.className = 'asset-picker-pop';
  pop.innerHTML = options.map(o=>`
    <div class="ap-opt ${o.value===currentValue?'sel':''}" data-v="${escapeHtml(o.value)}" tabindex="0" role="button">
      <span class="dot" style="background:${o.color||'transparent'}"></span>
      <span class="ap-name">${escapeHtml(o.label)}</span>
    </div>`).join('');
  document.body.appendChild(pop);
  const r = triggerEl.getBoundingClientRect();
  pop.style.width = Math.max(180, r.width)+'px';
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth-pop.offsetWidth-8))+'px';
  let top = r.bottom+6;
  if(top+pop.offsetHeight > window.innerHeight-8) top = r.top-pop.offsetHeight-6;
  pop.style.top = Math.max(8,top)+'px';
  $$('.ap-opt', pop).forEach(el=>{
    el.onclick = ()=>{ onPick(el.dataset.v); closeAssetPicker(); };
    el.onkeydown = (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); el.click(); } };
  });
  pop.querySelector('.ap-opt')?.focus();
  closeAssetPickerOutsideHandler = (e)=>{
    if(!pop.contains(e.target) && e.target!==triggerEl) closeAssetPicker();
  };
  setTimeout(()=> document.addEventListener('mousedown', closeAssetPickerOutsideHandler), 0);
}
// wires one trigger+hidden-input pair; buildOptions is a function (not a
// static array) since the asset list itself can change while the sheet is
// open (e.g. adding a new asset isn't possible mid-sheet today, but the
// options must still reflect state.assets at click time, not sheet-open
// time). Returns a setter so callers (template quick-fill) can update the
// display without duplicating the "look up the label for this id" logic.
function wireAssetTrigger(triggerId, labelId, hiddenId, buildOptions){
  const trigger = $('#'+triggerId), hidden = $('#'+hiddenId), label = $('#'+labelId);
  if(!trigger || !hidden || !label) return ()=>{};
  const setDisplay = (val)=>{
    hidden.value = val;
    const opts = buildOptions();
    const match = opts.find(o=>o.value===val);
    label.textContent = match ? match.label : (opts[0]?.label || '');
  };
  setDisplay(hidden.value);
  const open = ()=>{
    openAssetPicker(trigger, buildOptions(), hidden.value, (v)=>{
      setDisplay(v);
      hidden.dispatchEvent(new Event('change', {bubbles:true}));
    });
  };
  trigger.onclick = open;
  // trigger is a div[role=button][tabindex=0], not a real <button> — the
  // browser only auto-activates real form controls on Enter/Space, so a
  // keyboard user tabbing here needs this to actually open the picker.
  trigger.onkeydown = (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); open(); } };
  return setDisplay;
}

          <button class="sheet-close" id="closeAsset" aria-label="닫기">${icon('close',{size:18})}</button>
        </div>
        <div class="form-group"><label class="form-label">이름</label><input class="form-input" id="assetName" lang="ko" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="예: 주거래 통장" value="${existing?escapeHtml(existing.name):''}"></div>
        <div class="form-group"><label class="form-label">종류</label><select class="form-input" id="assetType"></select></div>
        <div class="form-group"><label class="form-label">금액</label><input class="form-input" type="text" id="assetAmount" placeholder="0" value="${existingBalance?existingBalance.toLocaleString('ko-KR'):''}"></div>
        <div class="form-group"><label class="form-label">색상</label><div class="color-grid" id="assetColor"></div></div>
        <div class="sheet-actions">
          ${existing?'<button class="btn btn-danger" id="assetDelete">삭제</button>':''}
          <button class="btn btn-primary" id="assetSave">저장</button>
        </div>
      </div>
    </div>`;
  $('#assetType').innerHTML = [...ASSET_TYPES_ASSET, ...ASSET_TYPES_LIAB].map(t=>`<option value="${t}" ${type===t?'selected':''}>${t}</option>`).join('');
  const paintColor = ()=>{
    $('#assetColor').innerHTML = ACCENT_PRESETS.map(c=>`<span class="color-opt ${color===c?'sel':''}" data-c="${c}" style="background:${c}"></span>`).join('');
    $$('#assetColor .color-opt').forEach(el=> el.onclick=()=>{ color=el.dataset.c; paintColor(); });
  };
  paintColor();
  wireAmountInput($('#assetAmount'));
  $('#closeAsset').onclick = closeModal;
  $('#ovAsset').onclick = (e)=>{ if(e.target.id==='ovAsset') closeModal(); };
  if(existing) guardedClick($('#assetDelete'), async ()=>{
    const inUse = state.transactions.some(t=>t.assetId===existing.id || t.fromAssetId===existing.id || t.toAssetId===existing.id);
    if(inUse && !confirm('이 자산과 연결된 내역이 있어요. 삭제할까요?')) return;
    await deleteDoc('assets', existing.id); closeModal(); scheduleRender(); toast('삭제했어요', {danger:true});
  });
  guardedClick($('#assetSave'), async ()=>{
    const name = $('#assetName').value.trim();
    const amount = amountValue($('#assetAmount'));
    const t = $('#assetType').value;
    if(!name){ toast('이름을 입력해주세요', {danger:true}); shakeSheet(); return; }
    // a 카드/대출·기타부채 liability's balance is legitimately negative
    // (money owed) — every other asset type still can't go negative.
    if(isNaN(amount) || (amount<0 && !ASSET_TYPES_LIAB.includes(t))){ toast('금액을 확인해주세요', {danger:true}); shakeSheet(); return; }
    // an asset's balance is always initialAmount + every transaction's
    // effect (see computeAssetBalances) — there's no separate live total to
    // overwrite. This field still shows/edits the CURRENT balance, matching
    // what's shown everywhere else, so correcting it here just shifts
    // initialAmount by the difference between what was shown and what was
    // typed — safe at any time, and every transaction stays exactly as
    // accurate as before.
    let initialAmount;
    if(existing){
      const deltaLists = computeAssetDeltaLists();
      const list = deltaLists.get(existing.id) || [];
      const oldInitial = resolveInitialAmount(existing, list);
      const before = oldInitial + list.reduce((s,d)=>s+d.delta, 0);
      initialAmount = oldInitial + (amount - before);
    } else {
      initialAmount = amount;
    }
    const data = { name, type:t, color, icon: ASSET_ICONS[t], initialAmount };
    if(existing) await updateDoc('assets', existing.id, data); else justAddedAssetId = await addDoc('assets', data);
    closeModal(); scheduleRender(); toast(existing?'수정했어요':'추가했어요');
  });
}

  if(existing) guardedClick($('#plannedDelete'), async ()=>{

function openTemplateModal(existing){
  const root = $('#modalRoot');
  lockBodyScroll();
  let type = existing?.type || 'expense';
  let categoryId = existing?.categoryId || null;
  root.innerHTML = `
    <div class="overlay" id="ovTpl">
      <div class="sheet">
        <div class="sheet-head">
          <div class="sheet-title">${existing?'템플릿 수정':'템플릿 추가'}</div>
          <button class="sheet-close" id="closeTpl" aria-label="닫기">${icon('close',{size:18})}</button>
        </div>
        <div class="form-group"><label class="form-label">이름</label><input class="form-input" id="tplName" lang="ko" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="예: 아메리카노, 월세" value="${existing?escapeHtml(existing.name):''}"></div>
        <div class="form-group">
          <div class="type-toggle" id="tplTypeToggle">
            <button type="button" data-t="expense" class="${type==='expense'?'sel-expense':''}">지출</button>
            <button type="button" data-t="income" class="${type==='income'?'sel-income':''}">수입</button>
          </div>
        </div>
        <div class="form-group"><label class="form-label">카테고리</label><div class="cat-pick-grid" id="tplCatPick"></div></div>
        <div class="form-group"><label class="form-label">금액</label><input class="form-input" type="text" id="tplAmount" placeholder="0" value="${existing?.amount?Number(existing.amount).toLocaleString('ko-KR'):''}"></div>
        <div class="form-group">
          <label class="form-label">자산</label>
          <div class="form-input asset-trigger" id="tplAssetTrigger" tabindex="0" role="button"><span class="at-label" id="tplAssetLabel">연결 안 함</span>${icon('chevronRight',{size:13})}</div>
          <input type="hidden" id="tplAsset" value="${existing?.assetId||''}">
        </div>
        <div class="sheet-actions">
          ${existing?'<button class="btn btn-danger" id="tplDelete">삭제</button>':''}
          <button class="btn btn-primary" id="tplSave">저장</button>
        </div>
      </div>
    </div>`;
  const paintCatPick = ()=>{
    const opts = categoriesByUsage(type);
    if(categoryId && !opts.some(c=>c.id===categoryId)) categoryId = null;
    if(!categoryId && opts.length) categoryId = opts[0].id;
    $('#tplCatPick').innerHTML = opts.length ? opts.map(c=>`
      <span class="cat-opt ${categoryId===c.id?'sel':''}" data-id="${c.id}" tabindex="0" role="button" style="${categoryId===c.id?`background:${c.color}1F;color:${c.color};border-color:${c.color}`:''}">
        ${icon(c.icon||'sparkle',{size:14})}<span>${escapeHtml(c.name)}</span>
      </span>
    `).join('') : `<div class="empty" style="padding:14px 6px"><div>카테고리를 먼저 추가해주세요</div></div>`;
    $$('#tplCatPick .cat-opt').forEach(el=>{
      el.onclick=()=>{ categoryId=el.dataset.id; paintCatPick(); };
      el.onkeydown=(e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); el.click(); } };
    });
  };
  const fillAssetSelect = ()=>{
    const balances = computeAssetBalances();
    const assets = sortAssetsForPicker(state.assets.filter(a=>!ASSET_TYPES_LIAB.includes(a.type)), balances);
    const liabs = sortAssetsForPicker(state.assets.filter(a=>ASSET_TYPES_LIAB.includes(a.type)), balances);
    const buildOptions = ()=> [
      {value:'', label:'연결 안 함', color:null},
      ...assets.map(a=>({value:a.id, label:a.name, color:a.color})),
      ...liabs.map(a=>({value:a.id, label:a.name, color:a.color})),
    ];
    wireAssetTrigger('tplAssetTrigger','tplAssetLabel','tplAsset', buildOptions);
  };
  paintCatPick();
  fillAssetSelect();
  wireAmountInput($('#tplAmount'));
  positionTypeToggleIndicator($('#tplTypeToggle'));
  $$('#tplTypeToggle button').forEach(b=> b.onclick = ()=>{
    type=b.dataset.t; categoryId=null;
    $$('#tplTypeToggle button').forEach(x=>x.className='');
    b.className = type==='expense'?'sel-expense':'sel-income';
    positionTypeToggleIndicator($('#tplTypeToggle'));
    paintCatPick();
  });
  $('#closeTpl').onclick = closeModal;
  $('#ovTpl').onclick = (e)=>{ if(e.target.id==='ovTpl') closeModal(); };
  if(existing) guardedClick($('#tplDelete'), async ()=>{
    await deleteDoc('templates', existing.id); closeModal(); scheduleRender(); toast('삭제했어요', {danger:true});
  });
  guardedClick($('#tplSave'), async ()=>{
    const name = $('#tplName').value.trim();
    const amount = amountValue($('#tplAmount'));
    if(!name){ toast('이름을 입력해주세요', {danger:true}); shakeSheet(); return; }
    if(!categoryId){ toast('카테고리를 선택해주세요', {danger:true}); shakeSheet(); return; }
    if(!amount || amount<=0){ toast('금액을 입력해주세요', {danger:true}); shakeSheet(); return; }
    const assetId = $('#tplAsset').value || null;
    const data = { name, type, categoryId, amount, assetId };
    if(existing) await updateDoc('templates', existing.id, data); else await addDoc('templates', data);
    closeModal(); scheduleRender(); toast(existing?'수정했어요':'추가했어요');
  });
}

/* ---------- swipe-to-switch-tab (mobile only) ---------- */
// mirrors the bottom nav's own tab order (TAB_ORDER, shared with render()'s
// direction-aware transition). Only active at mobile layout widths (matches
// the .app column/bottom-nav breakpoint) so it never fights with the
// desktop rail or with genuinely horizontal-scrolling widgets, which all
// live inside modals rather than #main.
//
// The content visibly tracks the finger (touch-action:pan-y on #main cedes
// horizontal gesture handling to this listener instead of the browser's own
// edge-swipe-back, which is what made one direction feel unreliable before)
// and either finishes the push into the next tab or springs back — both
// directions are symmetric, there's no directional bias.
(function initSwipeNav(){
  const main = $('#main');
  let startX = 0, startY = 0, axis = null, tracking = false, dragDX = 0, swapping = false;
  main.addEventListener('touchstart', (e)=>{
    tracking = !swapping && window.innerWidth<=720 && !$('#modalRoot .overlay') && e.touches.length===1;
    if(!tracking) return;
    axis = null; dragDX = 0;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    main.style.transition = 'none';
  }, {passive:true});
  main.addEventListener('touchmove', (e)=>{
    if(!tracking) return;
    const dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
    if(axis===null){
      // require a decisive, mostly-horizontal drag before committing to
      // either axis — an ordinary vertical scroll (or a diagonal thumb
      // slip) should never get mistaken for a swipe.
      if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
      axis = Math.abs(dx) > Math.abs(dy)*1.2 ? 'x' : 'y';
      if(axis!=='x'){ tracking = false; return; } // hand off to native vertical scroll
    }
    e.preventDefault();
    const idx = TAB_ORDER.indexOf(state.tab);
    const atStart = idx<=0 && dx>0, atEnd = idx>=TAB_ORDER.length-1 && dx<0;
    // rubber-band resistance past the first/last tab, same idea as iOS
    // overscroll, so dragging off either end still feels like it's
    // responding to your finger instead of just doing nothing.
    dragDX = (atStart || atEnd) ? dx*0.35 : dx;
    main.style.transform = `translateX(${dragDX}px)`;
  }, {passive:false});
  main.addEventListener('touchend', ()=>{
    if(!tracking || axis!=='x'){ tracking = false; axis = null; return; }
    tracking = false;
    const idx = TAB_ORDER.indexOf(state.tab);
    const nextIdx = idx + (dragDX<0 ? 1 : -1);
    const valid = Math.abs(dragDX)>=60 && nextIdx>=0 && nextIdx<TAB_ORDER.length;
    main.style.transition = 'transform .22s cubic-bezier(.22,.75,.32,1)';
    if(valid){
      swapping = true;
      main.style.transform = `translateX(${dragDX<0?-100:100}%)`;
      const finish = ()=>{
        main.removeEventListener('transitionend', finish);
        state.tab = TAB_ORDER[nextIdx];
        main.style.transition = 'none';
        main.style.transform = '';
        render();
        swapping = false;
      };
      main.addEventListener('transitionend', finish, {once:true});
      setTimeout(()=>{ if(swapping) finish(); }, 260); // safety net if transitionend never fires
    } else {
      main.style.transform = 'translateX(0px)';
    }
    axis = null;
  }, {passive:true});
  main.addEventListener('touchcancel', ()=>{
    if(!tracking) return;
    tracking = false; axis = null;
    main.style.transition = 'transform .22s ease';
    main.style.transform = 'translateX(0px)';
  }, {passive:true});
})();

/* ---------- boot ---------- */
paintStaticIcons();
wireAuthUI();
$$('.navlink').forEach(b=> b.onclick = ()=>{ state.tab = b.dataset.tab; scheduleRender(); });
$('#fab').onclick = ()=> openTxModal(null);
applyAccent(state.settings.accent);
applyTheme(state.settings.theme);
</script>
